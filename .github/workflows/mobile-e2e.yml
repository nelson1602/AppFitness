# Mobile E2E — seeded local API + Android emulator + Maestro (ADR-P008).
#
# Manual dispatch only. Everything is colocated on one runner: disposable
# Postgres service, the real NestJS api, an Android emulator, and a release
# APK of the e2e variant built ON THIS RUNNER (ADR-P047 D8: e2e APKs are never
# built on EAS cloud or distributed). adb reverse maps the app's
# 127.0.0.1:3001 to the runner-local API — no external backend can be
# reached. All credentials below are throwaway CI values.
name: mobile-e2e

on:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/appfitness_ci
  JWT_ACCESS_SECRET: ci_only_jwt_secret_not_a_real_secret_0000000001
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  MEDICAL_ENC_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
  MEDICAL_ENC_KEY_ID: ci-dummy-1
  PORT: '3001'
  EXPO_NO_TELEMETRY: '1'

jobs:
  e2e:
    name: Registration + dashboard sync + onboarding loop + food logging + workout + progress (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: appfitness_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d appfitness_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json

      - name: Boot API against disposable Postgres
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          nohup node dist/src/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3001/health

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # ADR-P047 D8: the e2e APK is built here from this commit — no EAS cloud
      # build, no EXPO_TOKEN, nothing published. Same env as the eas.json `e2e`
      # profile; app.config.js refuses APP_VARIANT=e2e without the matching
      # EXPO_PUBLIC_APP_VARIANT. Release build type, debug-keystore signed by
      # the prebuild template, so it cannot be uploaded to Play.
      - name: Build the e2e APK locally (prebuild + Gradle)
        working-directory: mobile
        env:
          APP_VARIANT: e2e
          EXPO_PUBLIC_APP_VARIANT: e2e
          EXPO_PUBLIC_API_URL: http://127.0.0.1:3001
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk /tmp/appfitness-e2e.apk
          ls -la /tmp/appfitness-e2e.apk

      # Pinned release zip with its published SHA-256 (no `curl | bash`).
      # To upgrade: take the new tag's maestro.zip digest from the release's
      # checksums_sha256.txt and update both values together.
      - name: Install Maestro (pinned)
        env:
          MAESTRO_VERSION: 2.12.1
          MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
        run: |
          curl -fsSL -o /tmp/maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  /tmp/maestro.zip" | sha256sum -c -
          unzip -q /tmp/maestro.zip -d "$HOME/.maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -r "$HOME/.maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The Gradle build leaves JVMs behind (the Kotlin compile daemon is not
      # covered by --no-daemon); free that memory before the emulator boots.
      - name: Free build memory
        run: |
          pkill -f KotlinCompileDaemon || true
          pkill -f GradleDaemon || true
          free -m

      - name: Run E2E flows on emulator
        # Bounded below the job timeout so a hang fails this step and the
        # debug artifact below is still uploaded.
        timeout-minutes: 65
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        # TEST-007: a Pixel 7 profile on API 35 (the local reference AVD). The
        # runner's default device is a bare 320x640 screen, far shorter than any
        # supported phone, and the API 34 image crashed in GWP-ASan sampling.
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          # RAM stays at the profile default: with 4096M the emulator process
          # vanished mid-flow on the hosted runner (run 44350906460).
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          # The flow sequence lives in e2e/run-flows.sh (shared with local
          # runs); on failure it saves logcat and tombstones to /tmp/e2e-debug.
          script: |
            adb install -r /tmp/appfitness-e2e.apk
            adb reverse tcp:3001 tcp:3001
            bash e2e/run-flows.sh

      - name: Upload API log and Maestro artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-debug
          path: |
            /tmp/api.log
            /tmp/e2e-debug/**
            /tmp/android-runner/emu-crash*
            ~/.maestro/tests/**
          retention-days: 7
