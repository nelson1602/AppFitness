# Mobile E2E — seeded local API + Android emulator + Maestro (ADR-P008).
#
# Manual dispatch only. Everything is colocated on one runner: disposable
# Postgres service, the real NestJS api, an Android emulator, and a release
# APK of the e2e variant built ON THIS RUNNER (ADR-P047 D8: e2e APKs are never
# built on EAS cloud or distributed). adb reverse maps the app's
# 127.0.0.1:3001 to the runner-local API — no external backend can be
# reached. All credentials below are throwaway CI values.
name: mobile-e2e

on:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/appfitness_ci
  JWT_ACCESS_SECRET: ci_only_jwt_secret_not_a_real_secret_0000000001
  JWT_ACCESS_EXPIRES_IN: 15m
  JWT_REFRESH_EXPIRES_IN: 7d
  MEDICAL_ENC_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
  MEDICAL_ENC_KEY_ID: ci-dummy-1
  PORT: '3001'
  EXPO_NO_TELEMETRY: '1'

jobs:
  e2e:
    name: Registration + dashboard sync + onboarding loop + food logging + workout + progress (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: appfitness_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d appfitness_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json

      - name: Boot API against disposable Postgres
        working-directory: api
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          nohup node dist/src/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3001/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3001/health

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ADR-P047 D8: the e2e APK is built here from this commit — no EAS cloud
      # build, no EXPO_TOKEN, nothing published. Same env as the eas.json `e2e`
      # profile; app.config.js refuses APP_VARIANT=e2e without the matching
      # EXPO_PUBLIC_APP_VARIANT. Release build type, debug-keystore signed by
      # the prebuild template, so it cannot be uploaded to Play.
      - name: Build the e2e APK locally (prebuild + Gradle)
        working-directory: mobile
        env:
          APP_VARIANT: e2e
          EXPO_PUBLIC_APP_VARIANT: e2e
          EXPO_PUBLIC_API_URL: http://127.0.0.1:3001
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk /tmp/appfitness-e2e.apk
          ls -la /tmp/appfitness-e2e.apk

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: mobile
          script: |
            adb install -r /tmp/appfitness-e2e.apk
            adb reverse tcp:3001 tcp:3001
            maestro test .maestro/smoke-auth-surface.yml
            # Journey A — seeded server → device pull (existing coverage).
            maestro test -e E2E_EMAIL=demo@appfitness.local -e E2E_USERNAME=demo -e E2E_PASSWORD=Password-12345 .maestro/registration.yml
            # ADR-P041: verify on the local disposable DB, then continue into the app.
            node e2e/verify-email.mjs demo@appfitness.local
            maestro test .maestro/registration-verified.yml
            node e2e/seed.mjs
            maestro test .maestro/dashboard-sync.yml
            # Journey B — full device-side onboarding loop (Phase 14). A
            # distinct synthetic user keeps its device-entered data separate
            # from Journey A's server-seeded dataset. Every data point
            # (profile, physical evaluation/weight, goal) is entered on the
            # device — no server seed step.
            maestro test -e E2E_EMAIL=onboard@appfitness.local -e E2E_USERNAME=onboard -e E2E_PASSWORD=Password-12345 .maestro/registration.yml
            # ADR-P041: verify on the local disposable DB, then continue into the app.
            node e2e/verify-email.mjs onboard@appfitness.local
            maestro test .maestro/registration-verified.yml
            maestro test -e E2E_EMAIL=onboard@appfitness.local -e E2E_PASSWORD=Password-12345 .maestro/onboarding-loop.yml
            # Phase 15 Slice 4D — device-side food logging on top of the merged
            # Slice 4C write path. Reuses the onboard session: open the food log
            # from the meal-plan entry point, log a catalog food, see totals
            # update, confirm a sync attempt keeps the (pending) entry, delete it.
            maestro test .maestro/food-log.yml
            # ADR-P014 Slice 4 — food-log excluded-food warning. Same onboard
            # session: add a "Nuts" allergy via the dietary-preferences surface,
            # then confirm selecting a nut food on the food log shows the
            # non-blocking allergy/sensitivity warning and can still be logged.
            maestro test .maestro/food-log-exclusion-warning.yml
            # Phase 16 Slice 8 — workout module + read-only iCoach TrainingPlan
            # integration. Medical management remains retained but dormant for
            # public v1, so this journey uses wellness inputs only.
            maestro test .maestro/workout-training-plan.yml
            # Phase 16 Slice 10 — custom-exercise UI. Same onboard session:
            # create/edit a user-owned custom exercise from the Exercise
            # library, use it from both workout pickers, soft-delete it, and
            # verify historical routine references fall back safely.
            maestro test .maestro/workout-custom-exercise.yml
            # Phase 17 Slice 6 — Progress Monitoring. Same onboard session: open
            # the Progress surface from the dashboard summary card, record a body
            # weight (auto-recomputes the weekly snapshot) and a waist
            # measurement, re-run "Update weekly insights", and assert the
            # accessible trend text + weekly snapshot summary (deload as text).
            maestro test .maestro/progress-monitoring.yml
            # Phase 14.5 — offline data entry. Register online, then DROP the
            # adb-reverse loopback to simulate offline (airplane mode does not
            # sever it): a profile saves locally + sync goes "Offline".
            # Restore the loopback and confirm the queued change syncs.
            maestro test -e E2E_EMAIL=offline@appfitness.local -e E2E_USERNAME=offline -e E2E_PASSWORD=Password-12345 .maestro/registration.yml
            # ADR-P041: verify on the local disposable DB, then continue into the app.
            node e2e/verify-email.mjs offline@appfitness.local
            maestro test .maestro/registration-verified.yml
            adb reverse --remove tcp:3001
            maestro test .maestro/offline-entry.yml
            adb reverse tcp:3001 tcp:3001
            maestro test .maestro/reconnect-sync.yml

      - name: Upload API log and Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            /tmp/api.log
            ~/.maestro/tests/**
          retention-days: 7
