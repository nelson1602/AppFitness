# ADR-P008 — registration → empty dashboard (requires the seeded-local-API
# setup: api/ running on the host, a FRESH disposable database, and
# `adb reverse tcp:3001 tcp:3001` so the release build's 127.0.0.1 API URL
# reaches the host).
#
# The sign-in surface ships with EMPTY fields (release product gate) —
# credentials are typed via testIDs and MUST be passed per run (no flow
# env defaults: they would shadow -e overrides):
#   maestro test -e E2E_EMAIL=demo@appfitness.local \
#                -e E2E_USERNAME=demo -e E2E_PASSWORD=Password-12345 \
#                .maestro/registration.yml
# The password must meet the ADR-P041 policy (upper, lower, digit, symbol).
# Fake, synthetic identities only; fresh disposable DB per run.
appId: com.appfitnessrd.mobile
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'AppFitnessRD'
    timeout: 30000

# Switch to register mode and enter the disposable identity.
- tapOn: 'Create an account'
- assertVisible: 'Create account'
- tapOn:
    id: 'input-email'
- inputText: ${E2E_EMAIL}
- tapOn:
    id: 'input-username'
- inputText: ${E2E_USERNAME}
# The soft keyboard can cover the password field on small screens.
- hideKeyboard
- tapOn:
    id: 'input-password'
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: 'Create account'

# ADR-P041 D2: a new account lands on "Verify your email" and can go no
# further until the address is verified. The harness sends no real email, so
# the run continues with registration-verified.yml after
#   node e2e/verify-email.mjs <the same E2E_EMAIL>
- extendedWaitUntil:
    visible:
      id: 'verify-pending'
    timeout: 90000
- assertVisible: 'Verify your email'
