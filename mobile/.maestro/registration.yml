# ADR-P008 — registration → empty dashboard (requires the seeded-local-API
# setup: api/ running on the host, a FRESH disposable database, and
# `adb reverse tcp:3001 tcp:3001` so the release build's 127.0.0.1 API URL
# reaches the host).
#
# The sign-in surface ships with EMPTY fields (release product gate) —
# credentials are typed via testIDs and MUST be passed per run (no flow
# env defaults: they would shadow -e overrides):
#   maestro test -e E2E_EMAIL=demo@appfitness.local \
#                -e E2E_USERNAME=demo -e E2E_PASSWORD=password12345 \
#                .maestro/registration.yml
# Fake, synthetic identities only; fresh disposable DB per run.
appId: com.appfitness.mobile
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'AppFitness'
    timeout: 30000

# Switch to register mode and enter the disposable identity.
- tapOn: 'Create a local account'
- assertVisible: 'Register'
- tapOn:
    id: 'input-email'
- inputText: ${E2E_EMAIL}
- tapOn:
    id: 'input-username'
- inputText: ${E2E_USERNAME}
# The soft keyboard can cover the password field on small screens.
- hideKeyboard
- tapOn:
    id: 'input-password'
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: 'Register'

# Registration hits the local API, then routes to the dashboard. A brand-new
# account has no assessment, so the dashboard resolves to its `empty` state and
# renders the ADR-P027 onboarding checklist. "Finish your baseline" belongs to
# `DataGapCard`, which renders only once the assessment is `ready` — asserting
# it here is what made this flow stale.
#
# The checklist also sits below the verification reminder and the wellness
# recommendation card, so on a phone viewport it is below the fold and must be
# scrolled to rather than merely waited for.
- extendedWaitUntil:
    visible: 'Your local iCoach assessment'
    timeout: 45000
- scrollUntilVisible:
    element:
      id: 'onboarding-step-profile'
    timeout: 30000
- assertVisible:
    id: 'onboarding-step-profile'

# Dev-only seed action must not exist in release builds.
- assertNotVisible: 'Load sample data'
