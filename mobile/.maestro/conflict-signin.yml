# ADR-P030 C-7 — sign a disposable account in on one device.
#
# Shared entry point for every conflict journey. Clears state first, so each
# device starts from a known-empty local database: the conflicts a journey
# then observes can only be the ones that journey created.
#
#   maestro --device <serial> test -e E2E_EMAIL=... -e E2E_PASSWORD=... \
#     .maestro/conflict-signin.yml
appId: com.appfitnessrd.mobile
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: 'AppFitnessRD'
    timeout: 90000
- assertVisible: 'Sign in and keep moving toward your goal.'

- tapOn:
    id: 'input-email'
- inputText: ${E2E_EMAIL}
- hideKeyboard
- tapOn:
    id: 'input-password'
- inputText: ${E2E_PASSWORD}
- hideKeyboard
# The redesigned sign-in (ADR-P035) has no route header, so there is one
# "Sign in" control: target it below the password field, as onboarding-loop does.
- tapOn:
    text: 'Sign in'
    below:
      id: 'input-password'

# ADR-P039 D5: a sign-in opens the welcome screen once. Its auto-continue is
# off under reduced motion (an emulator with animations off reports it), so
# the flow continues explicitly.
- extendedWaitUntil:
    visible:
      id: 'welcome-continue'
    timeout: 90000
- tapOn:
    id: 'welcome-continue'
- extendedWaitUntil:
    visible:
      id: 'tab-dashboard'
    timeout: 90000
