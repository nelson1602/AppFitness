# ADR-P008 / TEST-004 — full device-side onboarding loop.
#
# Proves the production-path loop for a brand-new account whose data was all
# entered ON THE DEVICE: since v8 Block 2 that is the Evaluación física in
# registration-verified.yml (profile, birth date, height, weight and goal), so
# there is no server seed and no onboarding checklist. This flow proves that
# the iCoach assessment is `ready` from that local data, that the local changes
# sync and the pending state clears, that Nutrición and the meal plan render
# from it, and that the account can sign out and back in with its data intact.
#
# Prereqs (same seeded-local-API setup as registration.yml): api/ running on
# the host, a FRESH disposable database, and `adb reverse tcp:3001 tcp:3001`.
# Run AFTER registration.yml + registration-verified.yml for the SAME account.
# Credentials are passed per run (the release sign-in surface ships with empty
# fields):
#
#   maestro test -e E2E_EMAIL=<addr> -e E2E_PASSWORD=<pw> .maestro/onboarding-loop.yml
#
# Fake, synthetic identities only; fresh disposable DB per run.
appId: com.appfitnessrd.mobile
---
- launchApp

# Session restore → Inicio, populated from the evaluation.
- extendedWaitUntil:
    visible:
      id: 'tab-dashboard'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'home-eval-bmi'
    timeout: 30000

# --- 1. The assessment is ready from local data; no first-run checklist ---
# Sync, conflicts and the assessment live in Perfil → Cuenta y ajustes
# (ADR-P039); the recommendations row appears once the assessment is ready.
- tapOn:
    id: 'tab-profile'
- assertNotVisible:
    id: 'onboarding-progress'
# Dev-only seed action must never appear in a release build.
- assertNotVisible: 'Load sample data'
- scrollUntilVisible:
    element:
      id: 'profile-recommendations'
    # Centred: a row left at the bottom edge sits under the floating tab bar.
    centerElement: true
    timeout: 30000
- runFlow:
    when:
      notVisible: "Today's evaluation"
    commands:
      - tapOn:
          id: 'profile-recommendations'
- scrollUntilVisible:
    element: "Today's evaluation"
    timeout: 30000
# The evaluation set a goal, so iCoach does not fall back to maintenance.
- assertNotVisible: 'Using maintenance goal'
- assertNotVisible: 'Complete your basic info'

# --- 2. Sync the local evaluation data; the pending state clears ---
- scrollUntilVisible:
    element: 'Sync now'
    direction: UP
    centerElement: true
    timeout: 30000
- tapOn: 'Sync now'
- extendedWaitUntil:
    visible: 'Local data ready'
    timeout: 60000
- scrollUntilVisible:
    element: 'Coach recommendations'
    timeout: 60000

# --- 3. The Nutrición tab: today's calories and macros (ADR-P039) ---
- tapOn:
    id: 'tab-nutrition'
- extendedWaitUntil:
    visible:
      id: 'nutrition-today-card'
    timeout: 15000
- assertVisible: '.*kcal.*'
- assertVisible: 'Protein'
# No dev-only sample-data path on this surface.
- assertNotVisible: 'Load sample data'

# --- 4. 15-day meal plan surface (Phase 15 Slice 3B) ---
# Reached through the tab's targets row (ADR-P039), then its plan button.
- scrollUntilVisible:
    element:
      id: 'nutrition-targets'
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'nutrition-targets'
- scrollUntilVisible:
    element: '15-day meal plan'
    timeout: 60000
- tapOn: '15-day meal plan'
- scrollUntilVisible:
    element: 'Breakfast'
    timeout: 20000
- scrollUntilVisible:
    element: '.*kcal.*'
    timeout: 20000
- assertNotVisible: 'Load sample data'
# Back to the Nutrición tab (plan → targets → tab).
- back
- back

# --- 5. Sign out, then sign back in as the SAME existing account ---
# Sign out lives on the Perfil tab (ADR-P039 D1).
- tapOn:
    id: 'tab-profile'
- scrollUntilVisible:
    element: 'Sign out'
    centerElement: true
    timeout: 60000
- tapOn: 'Sign out'
- extendedWaitUntil:
    visible: 'Sign in and keep moving toward your goal.'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'input-email'
    timeout: 15000
- tapOn:
    id: 'input-email'
- inputText: ${E2E_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'input-password'
    timeout: 15000
- tapOn:
    id: 'input-password'
- inputText: ${E2E_PASSWORD}
- hideKeyboard
# The submit button sits right below the password field; "Sign in" also
# appears in the headline copy, so match the button by position.
- scrollUntilVisible:
    element:
      text: 'Sign in'
      below:
        id: 'input-password'
    timeout: 15000
- tapOn:
    text: 'Sign in'
    below:
      id: 'input-password'
# ADR-P039 D5: a sign-in opens the welcome screen once. Its auto-continue is
# off under reduced motion (an emulator with animations off reports it), so
# the flow continues explicitly.
- extendedWaitUntil:
    visible:
      id: 'welcome-continue'
    timeout: 90000
- tapOn:
    id: 'welcome-continue'

# Existing account restores straight to the populated, already-synced app:
# local data survived sign-out.
- extendedWaitUntil:
    visible:
      id: 'tab-dashboard'
    timeout: 45000
- scrollUntilVisible:
    element:
      id: 'home-eval-bmi'
    timeout: 45000
- tapOn:
    id: 'tab-profile'
- assertNotVisible:
    id: 'onboarding-progress'
- assertNotVisible: 'Load sample data'
- scrollUntilVisible:
    element: 'Local data ready'
    timeout: 45000
- assertVisible:
    id: 'profile-recommendations'
