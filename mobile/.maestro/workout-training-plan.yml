# Phase 16 Slice 8 — Workout module E2E (ADR-P015).
#
# Proves the device-side workout journey end to end, including the read-only
# iCoach TrainingPlan integration (Slice 7):
#   1. dashboard → routine builder;
#   2. TrainingPlan guidance card is visible (never recomputed — read from the
#      deterministic assessment);
#   3. create a routine and add a built-in catalog exercise to it;
#   4. dashboard → workout log;
#   5. start a workout and log a set against a built-in exercise;
#   6. the saved set is visible and surfaced as pending (local-first).
#
# Prereqs (same seeded-local-API setup as the other flows): api/ running on the
# host, a disposable database, and `adb reverse tcp:3001 tcp:3001`. Runs on the
# persisted `onboard` session (established by onboarding-loop.yml), whose
# wellness profile, weight, and goal already make TrainingPlan available. No
# medical route or medical input participates in this public-v1 journey.
#
# Requires an EAS `e2e` APK built from the Phase 16 Slice 5–7 commits (the
# workout routes/screens) or later; an older APK predating the workout UI will
# fail immediately (no "Workout routines" entry point).
appId: com.appfitness.mobile
---
- launchApp

# Session restore → the ready dashboard for the onboard wellness account.
- extendedWaitUntil:
    visible: "Today's assessment"
    timeout: 45000

# --- 1. Navigate: dashboard → Workout routines ---
- scrollUntilVisible:
    element: 'Workout routines'
- tapOn: 'Workout routines'

# --- 2. TrainingPlan guidance is surfaced read-only from wellness inputs. ---
- extendedWaitUntil:
    visible: 'Your training guidance'
    timeout: 30000

# --- 3. Create a routine, then view its exercises and add a built-in one. ---
- scrollUntilVisible:
    element:
      id: 'routine-name'
- tapOn:
    id: 'routine-name'
- inputText: 'E2E push'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'routine-create'
- tapOn:
    id: 'routine-create'
# The created routine lands in "Your routines" below the create card.
- scrollUntilVisible:
    element: 'E2E push'
- tapOn: 'View exercises'

# --- The built-in catalog list appears and can be used in the routine. ---
- scrollUntilVisible:
    element:
      id: 'add-exercise-exercise.back_squat'
- tapOn:
    id: 'add-exercise-exercise.back_squat'
# The routine now lists the exercise (top of the routine's exercise list).
- scrollUntilVisible:
    element: 'Back squat'

# --- 4. Navigate: dashboard → Log a workout ---
# `back` restores the dashboard's scrolled position (near "Workout routines"),
# so scroll straight to the next entry point rather than asserting the
# above-the-fold assessment header.
- back
- scrollUntilVisible:
    element: 'Log a workout'
- tapOn: 'Log a workout'
- extendedWaitUntil:
    visible: 'Start a workout'
    timeout: 15000

# --- 5. Start an ad-hoc workout and log a set against a built-in exercise. ---
- tapOn:
    id: 'workout-name'
- inputText: 'E2E session'
- hideKeyboard
- tapOn:
    id: 'workout-start'
# The open workout appears under "Open workouts"; open its set list.
- scrollUntilVisible:
    element: 'E2E session'
- tapOn: 'Log sets'
# Choose a built-in exercise, then enter reps + weight. The reps/weight inputs
# render BELOW the built-in exercise catalog, so scroll each into view before
# tapping (a bare tap on an off-screen input fails).
- scrollUntilVisible:
    element:
      id: 'set-exercise-exercise.back_squat'
- tapOn:
    id: 'set-exercise-exercise.back_squat'
- scrollUntilVisible:
    element:
      id: 'set-reps-input'
- tapOn:
    id: 'set-reps-input'
- inputText: '5'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'set-weight-input'
- tapOn:
    id: 'set-weight-input'
- inputText: '100'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'set-add'
- tapOn:
    id: 'set-add'

# --- 6. The saved set is visible and local-first (pending sync). The set list
#     renders ABOVE the add-set form, so after tapping "Add set" (at the bottom)
#     scroll UP to reach the newly-logged set. ---
- scrollUntilVisible:
    direction: UP
    element: '1. Back squat'
- assertVisible: 'Pending sync'

# --- Finish the workout → it moves to "Recent workouts". The Finish button sits
#     in the card header, above the set list, so scroll UP to it. ---
- scrollUntilVisible:
    direction: UP
    element: 'Finish'
- tapOn: 'Finish'
# Finishing collapses the open card and shifts the layout, so scroll the
# "Recent workouts" section into view rather than asserting statically.
- scrollUntilVisible:
    element: 'Recent workouts'
- assertVisible: 'Finished'
