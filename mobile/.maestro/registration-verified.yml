# ADR-P041 — the second half of registration.yml, run after the harness has
# marked the disposable account verified on the LOCAL database:
#   node e2e/verify-email.mjs <email>
#   maestro test .maestro/registration-verified.yml
# "I've verified it" re-reads the account and continues into the app.
appId: com.appfitnessrd.mobile
---
- extendedWaitUntil:
    visible:
      id: 'button-verify-confirm'
    timeout: 30000
- tapOn:
    id: 'button-verify-confirm'
# v8 Block 2: a verified account without its evaluation lands on the
# Evaluación física. The date pickers open on their default dates (30 years
# ago; 90 days ahead), which are valid, so the flow accepts them.
- extendedWaitUntil:
    visible:
      id: 'evaluation-weight'
    timeout: 45000
- tapOn:
    id: 'evaluation-weight'
- inputText: '80'
- tapOn:
    id: 'evaluation-height'
- inputText: '175'
- hideKeyboard
- tapOn:
    id: 'evaluation-birth-date'
# v8.1: the birth date is the in-app Día / Mes / Año wheel sheet (default 30
# years ago, valid), confirmed with its own button; the target date below
# still opens the system picker.
- tapOn:
    id: 'evaluation-birth-date-done'
# Sex is optional, but without it iCoach adds the "sex not set" advisory
# (onboarding-loop.yml asserts the assessment carries no data gap).
- scrollUntilVisible:
    element:
      id: 'evaluation-sex-MALE'
    timeout: 15000
- tapOn:
    id: 'evaluation-sex-MALE'
- tapOn:
    id: 'evaluation-continue'
- tapOn:
    id: 'evaluation-continue'
- tapOn:
    id: 'evaluation-continue'
- tapOn:
    id: 'evaluation-continue'
- tapOn:
    id: 'evaluation-target-weight'
- inputText: '75'
- hideKeyboard
- tapOn:
    id: 'evaluation-target-date'
- tapOn: 'OK|Aceptar|ACEPTAR'
- tapOn:
    id: 'evaluation-continue'
- extendedWaitUntil:
    visible:
      id: 'evaluation-preview-kcal'
    timeout: 15000
- tapOn:
    id: 'evaluation-continue'
# "Creando tu plan personal" saves the first week, then opens the welcome. It
# can finish before Maestro looks (fast local API), so it is not asserted.
# ADR-P039 D5: a sign-in opens the welcome screen once. Its auto-continue is
# off under reduced motion (an emulator with animations off reports it), so
# the flow continues explicitly.
- extendedWaitUntil:
    visible:
      id: 'welcome-continue'
    timeout: 90000
- tapOn:
    id: 'welcome-continue'

# The welcome routes to the dashboard. Since v8 Block 2 the evaluation above
# fills the profile, birth date, height, weight and goal, so the account is not
# `empty` and the ADR-P027 onboarding checklist no longer renders; asserting it
# is what made this flow stale. Sync and conflicts live in Perfil → Cuenta y
# ajustes (ADR-P039), below the fold.
- extendedWaitUntil:
    visible:
      id: 'tab-dashboard'
    timeout: 45000
- tapOn:
    id: 'tab-profile'
- scrollUntilVisible:
    element:
      id: 'dashboard-sync-now'
    timeout: 30000

# Dev-only seed action must not exist in release builds.
- assertNotVisible: 'Load sample data'
