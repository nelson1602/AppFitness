# Phase 14.5 — offline data-entry proof.
#
# Runs while the runner-local API is UNREACHABLE. Offline is simulated by
# the CI/local harness dropping the adb-reverse loopback BEFORE this flow
# (`adb reverse --remove tcp:3001`) — emulator airplane mode does NOT sever
# that loopback, so it cannot simulate offline for this setup.
#
# Proves: a production data-entry path (the profile editor in Perfil) saves
# locally with no network, and the queued change surfaces as pending ("Local
# changes pending"). A companion `reconnect-sync.yml` (run after the loopback
# is restored) proves the queued change then syncs to "Local data ready".
#
# Prereqs: run AFTER registration.yml + registration-verified.yml (online) for
# the SAME account, THEN `adb reverse --remove tcp:3001`. Since v8 Block 2 the
# evaluation has already created the profile, so this flow EDITS it. Fake
# synthetic data only.
appId: com.appfitnessrd.mobile
---
- launchApp

# Session restores offline (stored session is kept when the server is
# unreachable — 48h offline operation), landing on Inicio.
- extendedWaitUntil:
    visible:
      id: 'tab-dashboard'
    timeout: 30000

# --- Edit the profile OFFLINE: the local-first write must succeed. ---
# The editor opens from Perfil → Cuenta y ajustes (ADR-P039).
- tapOn:
    id: 'tab-profile'
- scrollUntilVisible:
    element:
      id: 'profile-edit'
    # Centred: a row left at the bottom edge sits under the floating tab bar.
    centerElement: true
    timeout: 30000
- tapOn:
    id: 'profile-edit'
- scrollUntilVisible:
    element:
      id: 'field-occupation'
    centerElement: true
    timeout: 60000
- tapOn:
    id: 'field-occupation'
- eraseText
- inputText: 'E2E offline edit'
- hideKeyboard
- scrollUntilVisible:
    element: 'Save profile'
    timeout: 60000
- tapOn: 'Save profile'

# Local save succeeded with no network, and the change is queued: the sync
# row shows the pending (non-ready) state.
#
# We intentionally do NOT tap "Sync now" here: a failed sync attempt puts
# the op into a 60s retry backoff (backoff.ts), which would make the
# immediate reconnect retry flaky. The PENDING state already proves the
# offline local write + unsynced state; reconnect-sync.yml then pushes it.
# Saving returns to Inicio; the sync row lives in Perfil (ADR-P039).
- extendedWaitUntil:
    visible:
      id: 'tab-dashboard'
    timeout: 30000
- tapOn:
    id: 'tab-profile'
- scrollUntilVisible:
    element: 'Local changes pending'
    timeout: 30000
