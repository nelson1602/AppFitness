<style>
/* Layout: dark review stage (previous concept) + phone running the blue/white AppFitnessRD UI (current concept) */
:root {
  --stage: #060A14; --panel: #0E1726; --panel-line: #1E2C44; --stage-fg: #E6EDF7; --stage-muted: #94A3B8;
  --brand: #0A66C2; --sky: #38B6F5; --ice: #9BEBFF; --energy: #FF5A36;
  color-scheme: dark;
}
html, body { height: auto; }
body { background: var(--stage); color: var(--stage-fg); font-family: Inter, system-ui, sans-serif; }
h1, h2, h3 { text-wrap: balance; }
.tnum { font-variant-numeric: tabular-nums; }

@keyframes pulseRun { from { stroke-dashoffset: 520 } to { stroke-dashoffset: 0 } }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-5px) } }
@keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
@keyframes wave { 0%,100% { transform: rotate(-14deg) } 50% { transform: rotate(12deg) } }
@keyframes beat { 0%,100% { transform: scale(1) } 12% { transform: scale(1.12) } 24% { transform: scale(1) } 36% { transform: scale(1.07) } }
@keyframes scanLine { 0% { top: 12% } 50% { top: 82% } 100% { top: 12% } }
@keyframes fillUp { from { clip-path: inset(100% 0 0 0) } to { clip-path: inset(0 0 0 0) } }
@keyframes screenIn { from { opacity: .35; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes progress { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.08); opacity: 1 } 100% { transform: scale(1) } }

.pulse-run { stroke-dasharray: 150 370; animation: pulseRun 2.4s linear infinite; }
.pulse-fast { stroke-dasharray: 90 430; animation: pulseRun 1.3s linear infinite; }
.mz-run { animation: bob .42s ease-in-out infinite alternate; }
.mz-idle { animation: idle 2.6s ease-in-out infinite; }
.mz-wave { animation: wave 1.1s ease-in-out infinite; }
.beat { transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
.scan-line { animation: scanLine 1.6s ease-in-out infinite; }
.fill-up { animation: fillUp 1.5s ease-out forwards; }
.screen-in { animation: screenIn .45s cubic-bezier(.2,.8,.2,1) both; }
.sheet-up { animation: sheetUp .38s cubic-bezier(.2,.8,.2,1) both; }
.fade-in { animation: fade .25s ease both; }
.spin { animation: spin .8s linear infinite; }
.auto-progress { transform-origin: left; animation: progress 5s linear forwards; }
.pop { animation: pop .45s cubic-bezier(.2,.8,.2,1) both; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { scrollbar-width: none; }
.art-fade {
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 42%, #000 58%, transparent 100%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 42%, #000 58%, transparent 100%);
}
/* Hero art: long fade at the bottom and soft sides so it melts into the background with no dividing line */
.art-hero {
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 42%, rgba(0,0,0,.55) 68%, transparent 96%), linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to bottom, #000 0%, #000 42%, rgba(0,0,0,.55) 68%, transparent 96%), linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%);
  mask-composite: intersect;
}
.grad-text { background: linear-gradient(90deg, #67E8F9, #FF7A45); -webkit-background-clip: text; background-clip: text; color: transparent; }
.glass { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .pulse-run, .pulse-fast, .mz-run, .mz-idle, .mz-wave, .beat, .scan-line, .screen-in, .sheet-up, .pop { animation: none !important; }
  .fill-up { animation: none; clip-path: none; }
}
.stage-wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
</style>

<div class="stage-wrap"><div id="root"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------- Icons ---------- */
const ICONS = {
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  finger: '<path d="M12 11v3a8 8 0 0 1-1 4"/><path d="M8 12a4 4 0 0 1 8 0v1"/><path d="M5 10a7 7 0 0 1 14 0v3"/><path d="M16 17a14 14 0 0 1-.5 3"/><path d="M8 16a12 12 0 0 1-1 4"/>',
  face: '<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9v1M15 9v1M12 9v4h-1M9 16c1.7 1.3 4.3 1.3 6 0"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  logout: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4M6 12h10"/>',
  home: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>',
  dumbbell: '<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
  food: '<path d="M12 7c-1-3-4-3-5-2-3 2-2 9 1 12 1 1 2 1 4 0 2 1 3 1 4 0 3-3 4-10 1-12-1-1-4-1-5 2z"/><path d="M12 7c0-2 1-4 3-4"/>',
  heart: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  steps: '<path d="M4 16v-2.4C4 11.5 3 10.5 3 8c0-2.7 1.5-6 4.5-6C9.4 2 10 3.8 10 5.5c0 3.1-2 5.7-2 8.7V16a2 2 0 1 1-4 0z"/><path d="M20 20v-2.4c0-2.1 1-3.1 1-5.6 0-2.7-1.5-6-4.5-6C14.6 6 14 7.8 14 9.5c0 3.1 2 5.7 2 8.7V20a2 2 0 1 0 4 0z"/>',
  flame: '<path d="M12 3s5 4.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 0 2 1 3 2 3 0-3 .5-5.5.5-8z"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  play: '<path d="M7 5l12 7-12 7z"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  scale: '<path d="M5 20h14a1 1 0 0 0 1-1L18 7H6L4 19a1 1 0 0 0 1 1z"/><path d="M9 11a3 3 0 0 1 6 0"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="m9 12 2 2 4-4"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  gauge: '<path d="M4 18a9 9 0 1 1 16 0"/><path d="M12 14l4-5"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/>',
  sparkle: '<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/>',
  watch: '<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3M12 10v2l1.5 1"/>',
  clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  back: '<path d="m15 6-6 6 6 6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>'
};
function Icon({ n, s = 20, w = 2, className = '' }) {
  return <svg aria-hidden="true" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={w}
    strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: ICONS[n] }} />;
}

/* ---------- Brand pieces ---------- */
const PULSE = 'M0 28H96L106 28L116 10L128 50L140 4L152 42L162 28H232L242 28L250 16L260 40L268 28H342';
function Pulse({ id, h = 56, track = 'rgba(255,255,255,.28)', stops = ['#FFFFFF', '#9BEBFF', '#FF5A36'], fast = false, className = '' }) {
  return (
    <svg aria-hidden="true" viewBox="0 0 342 56" width="100%" height={h} preserveAspectRatio="none" className={className}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="342" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stopColor={stops[0]} /><stop offset=".55" stopColor={stops[1]} /><stop offset="1" stopColor={stops[2]} />
        </linearGradient>
      </defs>
      <path d={PULSE} stroke={track} strokeWidth="2" fill="none" strokeLinejoin="round" />
      <path className={fast ? 'pulse-fast' : 'pulse-run'} d={PULSE} stroke={`url(#${id})`} strokeWidth="3.4" fill="none" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Ring({ value, max, size = 120, sw = 12, color = '#FF5A36', track = '#E3EAF4', children }) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, pct = Math.min(value / max, 1);
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90" aria-hidden="true">
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={sw} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c * (1 - pct)} style={{ transition: 'stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)' }} />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">{children}</div>
    </div>
  );
}

const HERO_BG = 'linear-gradient(160deg, #0A3FA8 0%, #1279E0 55%, #38B6F5 100%)';
const bioName = (hw) => (hw === 'faceid' ? 'Face ID' : 'tu huella');
const bioTitle = (hw) => (hw === 'faceid' ? 'Face ID' : 'Huella digital');

/* Blend: the blue glow of the original AppFitnessRD art melting into the dark navy of the first concept, no hard edge */
const BLEND_BG = [
  'radial-gradient(120% 55% at 50% 0%, #1F8BF0 0%, #0B4FC4 40%, rgba(11,79,196,0) 72%)',
  'radial-gradient(60% 35% at 100% 72%, rgba(255,90,54,.20), transparent 70%)',
  'radial-gradient(70% 40% at 0% 88%, rgba(34,211,238,.16), transparent 70%)',
  'linear-gradient(180deg, #0A3FA8 0%, #0A2A6E 38%, #08142E 68%, #060A14 100%)'
].join(',');
const BTN_BG = 'linear-gradient(90deg, #0A57C2, #0C8DDB)';

/* El Muñeco + logo: the user's original artwork, cropped with CSS */
const ART = { src: 'muneco.webp', w: 941, h: 1672, crops: { full: [0, 0, 941, 515], runner: [330, 85, 360, 220] } };
function Art({ crop = 'full', width = '100%', className = '', style = {} }) {
  const [x, y, w, h] = ART.crops[crop];
  return (
    <div role="img" aria-label="El Muñeco de AppFitnessRD" className={className} style={{
      width, aspectRatio: `${w} / ${h}`, maxWidth: '100%',
      backgroundImage: `url(${ART.src})`, backgroundRepeat: 'no-repeat',
      backgroundSize: `${ART.w / w * 100}% auto`,
      backgroundPosition: `${ART.w === w ? 0 : x / (ART.w - w) * 100}% ${y / (ART.h - h) * 100}%`,
      ...style
    }} />
  );
}

/* ---------- Login ---------- */
const T = {
  es: {
    h1a: 'Cada latido', h1b: 'cuenta.', sub: 'Inicia sesión y sigue hacia tu meta.',
    email: 'Correo electrónico', pw: 'Contraseña', forgot: '¿La olvidaste?', signin: 'Iniciar sesión',
    bioEnter: (hw) => (hw === 'faceid' ? 'Entrar con Face ID' : 'Entrar con tu huella'),
    bioHint: () => 'Podrás activar Face ID o Huella al iniciar sesión.',
    newHere: '¿Nuevo aquí?', create: 'Crea una cuenta', lang: 'Idioma', err: 'Escribe tu correo y tu contraseña.',
    show: 'Mostrar contraseña', hide: 'Ocultar contraseña'
  },
  en: {
    h1a: 'Every beat', h1b: 'counts.', sub: 'Sign in and keep moving toward your goal.',
    email: 'Email', pw: 'Password', forgot: 'Forgot it?', signin: 'Sign in',
    bioEnter: (hw) => (hw === 'faceid' ? 'Sign in with Face ID' : 'Sign in with fingerprint'),
    bioHint: () => 'You can turn on Face ID or fingerprint when you sign in.',
    newHere: 'New here?', create: 'Create an account', lang: 'Language', err: 'Enter your email and password.',
    show: 'Show password', hide: 'Hide password'
  }
};
const INPUT = 'h-[52px] w-full rounded-[14px] border border-transparent bg-white/95 pl-[46px] text-[15px] font-medium text-ink outline-none transition focus:border-[#22D3EE] focus:bg-white focus:ring-4 focus:ring-[#22D3EE]/25';

function Login({ hw, linked, lang, setLang, onLogin, onBio }) {
  const t = T[lang];
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const canBio = hw !== 'none';

  const submit = (e) => {
    e.preventDefault();
    if (!email.trim() || !pw) { setErr(t.err); return; }
    setErr(''); setLoading(true);
    setTimeout(() => { setLoading(false); onLogin(); }, 900);
  };

  return (
    <div className="screen-in no-scrollbar flex h-full flex-col overflow-y-auto pb-6 text-white" style={{ background: BLEND_BG }}>
      <Art className="art-hero shrink-0" />
      <Pulse id="pl-login" h={34} className="-mt-4 shrink-0" track="rgba(255,255,255,.14)" stops={['#22D3EE', '#9BEBFF', '#FF5A36']} />
      <div className="mt-1 px-6">
        <h1 className="font-display text-[28px] font-extrabold leading-tight tracking-[-0.8px]">{t.h1a} <span className="grad-text">{t.h1b}</span></h1>
        <p className="mt-1 text-[14px] text-[#C7D7F0]">{t.sub}</p>
      </div>

      <form onSubmit={submit} noValidate className="glass relative mx-4 mt-4 flex flex-col gap-3 rounded-[28px] p-5 shadow-[0_24px_60px_-24px_rgba(0,0,0,.65)]">
        <div className="flex flex-col gap-1.5">
          <label htmlFor="lg-email" className="text-[13px] font-semibold text-[#DCE7F7]">{t.email}</label>
          <div className="relative">
            <Icon n="mail" s={18} className="absolute left-4 top-[17px] text-[#6B7A90]" />
            <input id="lg-email" type="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} className={`${INPUT} pr-4`} />
          </div>
        </div>
        <div className="flex flex-col gap-1.5">
          <div className="flex items-baseline justify-between">
            <label htmlFor="lg-pass" className="text-[13px] font-semibold text-[#DCE7F7]">{t.pw}</label>
            <a href="#" onClick={(e) => e.preventDefault()} className="text-[13px] font-semibold text-[#67E8F9] hover:text-white">{t.forgot}</a>
          </div>
          <div className="relative">
            <Icon n="lock" s={18} className="absolute left-4 top-[17px] text-[#6B7A90]" />
            <input id="lg-pass" type={showPw ? 'text' : 'password'} autoComplete="current-password" value={pw} onChange={(e) => setPw(e.target.value)} className={`${INPUT} pr-[52px]`} />
            <button type="button" aria-label={showPw ? t.hide : t.show} onClick={() => setShowPw(!showPw)}
              className="absolute right-1 top-1 flex h-11 w-11 items-center justify-center rounded-[10px] text-muted hover:bg-field">
              <Icon n={showPw ? 'eyeOff' : 'eye'} />
            </button>
          </div>
        </div>
        {err && <p role="alert" className="text-[13px] font-medium text-[#FCA5A5]">{err}</p>}

        <div className="mt-1 flex gap-2.5">
          <button type="submit" disabled={loading} style={{ background: BTN_BG }}
            className="flex h-14 flex-1 items-center justify-center gap-2.5 rounded-2xl font-display text-[16px] font-bold text-white shadow-[0_12px_30px_-10px_rgba(34,211,238,.6)] transition hover:-translate-y-px hover:brightness-110 disabled:opacity-80">
            {loading ? <span className="spin h-5 w-5 rounded-full border-[3px] border-white/40 border-t-white" /> : <>{t.signin}<Icon n="arrow" s={18} w={2.6} /></>}
          </button>
          {canBio && linked && (
            <button type="button" aria-label={t.bioEnter(hw)} onClick={onBio}
              className="flex h-14 w-14 items-center justify-center rounded-2xl border-[1.5px] border-[#FF7A45] bg-white/5 text-[#FF9A75] transition hover:bg-white/10">
              <Icon n={hw === 'faceid' ? 'face' : 'finger'} s={26} />
            </button>
          )}
        </div>
        {canBio && linked && (
          <button type="button" onClick={onBio} className="text-[13px] font-semibold text-[#FF9A75] hover:text-white">{t.bioEnter(hw)}</button>
        )}
        {canBio && !linked && (
          <div className="flex items-center gap-2 rounded-xl bg-white/[.06] px-3 py-2.5 text-[12.5px] leading-snug text-[#C7D7F0]">
            <Icon n={hw === 'faceid' ? 'face' : 'finger'} s={18} className="shrink-0 text-[#67E8F9]" />{t.bioHint(hw)}
          </div>
        )}

        <div className="flex items-center gap-3 text-[13px] text-[#AFC2DD]">
          <div className="h-px flex-1 bg-white/15" />{t.newHere}<div className="h-px flex-1 bg-white/15" />
        </div>
        <a href="#" onClick={(e) => e.preventDefault()}
          className="flex h-12 items-center justify-center rounded-2xl border border-white/20 bg-white/5 text-[15px] font-semibold text-white transition hover:bg-white/10">{t.create}</a>
      </form>

      <div className="mx-6 mt-4 flex items-center justify-between gap-3">
        <span id="lg-lang" className="text-[13px] font-semibold text-[#DCE7F7]">{t.lang}</span>
        <div role="group" aria-labelledby="lg-lang" className="flex gap-2">
          {[['es', 'Español'], ['en', 'English']].map(([k, label]) => (
            <button key={k} type="button" aria-pressed={lang === k} onClick={() => setLang(k)}
              className={`h-11 rounded-xl border px-4 text-[14px] font-semibold transition ${lang === k ? 'border-white bg-white text-brand' : 'border-white/20 bg-white/5 text-white hover:bg-white/10'}`}>{label}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ---------- Biometric sheet ---------- */
function BioSheet({ sheet, hw, onActivate, onSkip }) {
  if (!sheet) return null;
  const isFace = hw === 'faceid';
  return (
    <div className="fade-in absolute inset-0 z-30 flex items-end bg-[#060A14]/60">
      <div role="dialog" aria-modal="true" aria-labelledby="bio-title" className="sheet-up w-full rounded-t-[32px] bg-white px-6 pb-8 pt-3 text-ink">
        <div className="mx-auto mb-4 h-1.5 w-11 rounded-full bg-line" />

/* ---------- Data from the physical evaluation (matches the app's profile, goal, medical and dietary models) ---------- */
const DAYS = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
const DAY_NAMES = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const TODAY = (new Date().getDay() + 6) % 7;
const fmt = (n) => Math.round(n).toLocaleString('en-US');
const fmtDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString('es-DO', { day: 'numeric', month: 'long', year: 'numeric' });
const todayIso = () => new Date().toISOString().slice(0, 10);

const CONDITIONS = ['Hipertensión', 'Diabetes tipo 2', 'Asma', 'Lesión de rodilla', 'Lesión de espalda', 'Condición cardíaca'];
const ALLERGIES = ['Frutos secos', 'Mariscos', 'Gluten', 'Lactosa', 'Alto en sodio', 'Alto en purinas'];
const ACTIVITY = [['Sedentaria', 1.2, 'Casi todo el día sentado'], ['Ligera', 1.375, 'Caminas un poco cada día'], ['Moderada', 1.55, 'Ejercicio 3 a 5 días'], ['Alta', 1.725, 'Ejercicio intenso casi a diario'], ['Muy alta', 1.9, 'Trabajo físico y entrenamiento']];
const GOALS = ['Pérdida de grasa', 'Ganancia muscular', 'Recomposición', 'Fuerza', 'Resistencia', 'Bienestar general', 'Mantenimiento'];
const GOAL_ADJ = { 'Pérdida de grasa': -400, 'Ganancia muscular': 250, 'Recomposición': -150, 'Fuerza': 100, 'Resistencia': 0, 'Bienestar general': 0, 'Mantenimiento': 0 };
const EQUIP = ['Gimnasio completo', 'Mancuernas', 'Banda elástica', 'Solo peso corporal'];
const STRESS = ['Muy bajo', 'Bajo', 'Medio', 'Alto', 'Muy alto'];

const EVAL_SAMPLE = {
  date: todayIso(), weight: 72, height: 163, age: 34, sex: 'Femenino',
  conditions: ['Lesión de rodilla'], bpSys: 128, bpDia: 82, rhr: 74, meds: '',
  allergies: ['Mariscos'], activity: 'Ligera', job: 'Oficina', sleep: 6.5, stress: 4, days: 4, minutes: 45, equipment: ['Mancuernas', 'Banda elástica'],
  goal: 'Pérdida de grasa', target: 64, targetDate: '2027-04-30'
};

const MEALS = {
  Desayuno: [['Mangú con huevo y aguacate', 520, []], ['Avena con guineo y canela', 380, ['Gluten']], ['Pan integral con queso blanco y tomate', 410, ['Gluten', 'Lactosa']], ['Batata asada con huevos revueltos', 450, []], ['Yogur griego con fresas y almendras', 340, ['Lactosa', 'Frutos secos']]],
  Almuerzo: [['Locrio de pollo con ensalada verde', 680, []], ['Moro de habichuelas con pechuga a la plancha', 640, []], ['Arroz con camarones y vegetales', 610, ['Mariscos']], ['Pescado a la plancha con tostones al horno', 590, []], ['Sancocho ligero de pollo', 560, ['Alto en sodio']]],
  Merienda: [['Piña con limón y chía', 150, []], ['Batida de lechosa con leche', 210, ['Lactosa']], ['Guineo con mantequilla de maní', 240, ['Frutos secos']], ['Casabe con aguacate', 200, []], ['Mezcla de nueces y pasas', 260, ['Frutos secos']]],
  Cena: [['Pechuga a la plancha con puré de yuca', 540, []], ['Ensalada de atún con aguacate', 430, []], ['Camarones al ajillo con arroz integral', 560, ['Mariscos']], ['Tortilla de vegetales con casabe', 420, []], ['Salmón con vegetales salteados', 520, []]]
};
const SLOTS = Object.keys(MEALS);
const EXTRA_FOODS = [['Arroz blanco (1 taza)', 205, []], ['Habichuelas guisadas (1 taza)', 230, ['Alto en sodio']], ['Pechuga de pollo (100 g)', 165, []], ['Plátano maduro al horno', 180, []], ['Aguacate (½)', 160, []], ['Camarones guisados (100 g)', 150, ['Mariscos', 'Alto en purinas']], ['Queso blanco (30 g)', 90, ['Lactosa']], ['Pan sobao (1 unidad)', 170, ['Gluten']]];
const ALL_FOODS = [...SLOTS.flatMap((s) => MEALS[s]), ...EXTRA_FOODS];
const mealFor = (day, slot, allergies) => {
  const ok = MEALS[slot].filter((m) => !m[2].some((t) => allergies.includes(t)));
  return ok[(day * 2 + SLOTS.indexOf(slot)) % ok.length];
};

function computePlan(e) {
  const w = +e.weight || 0, h = +e.height || 1, a = +e.age || 30;
  const bmi = w / (h / 100) ** 2;
  const bmiCat = bmi < 18.5 ? 'Bajo peso' : bmi < 25 ? 'Saludable' : bmi < 30 ? 'Sobrepeso' : 'Obesidad';
  const bmr = 10 * w + 6.25 * h - 5 * a + (e.sex === 'Masculino' ? 5 : -161);
  const factor = (ACTIVITY.find((x) => x[0] === e.activity) || ACTIVITY[1])[1];
  const kcal = Math.max(1200, Math.round((bmr * factor + GOAL_ADJ[e.goal]) / 10) * 10);
  const protein = Math.round(w * (['Pérdida de grasa', 'Ganancia muscular', 'Recomposición', 'Fuerza'].includes(e.goal) ? 2 : 1.6));
  const fat = Math.round(w * 0.9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  const knee = e.conditions.includes('Lesión de rodilla');
  const back = e.conditions.includes('Lesión de espalda');
  const heart = e.conditions.includes('Hipertensión') || e.conditions.includes('Condición cardíaca');
  const R = {
    sup: { name: 'Fuerza · tren superior', ex: [['Press de pecho con mancuernas', 4, '10', '12 kg'], ['Remo con mancuerna', 4, '12', '10 kg'], ['Press militar sentado', 3, '10', '6 kg'], ['Jalón con banda elástica', 3, '15', 'Banda media'], ['Plancha', 3, '40 s', '']] },
    inf: { name: 'Fuerza · tren inferior', ex: knee
      ? [['Puente de glúteo', 4, '12', '14 kg'], ['Peso muerto rumano', 4, '10', '10 kg'], ['Abducción con banda', 3, '15', 'Banda media'], ['Elevación de talones', 3, '15', ''], ['Bicicleta estática suave', 1, '10 min', '']]
      : [['Sentadilla goblet', 4, '10', '12 kg'], ['Zancadas', 3, '10', '6 kg'], ['Peso muerto rumano', 4, '10', '10 kg'], ['Elevación de talones', 3, '15', ''], ['Plancha lateral', 3, '30 s', '']] },
    cardio: { name: 'Cardio y core', ex: [[knee ? 'Bicicleta estática' : 'Trote suave', 1, '20 min', ''], ['Bird dog', 3, '12', ''], ['Dead bug', 3, '12', ''], ['Plancha', 3, '40 s', '']] },
    full: { name: 'Cuerpo completo', ex: [['Remo con banda', 3, '12', 'Banda media'], [knee ? 'Puente de glúteo' : 'Sentadilla goblet', 3, '12', '10 kg'], ['Flexiones inclinadas', 3, '10', ''], [back ? 'Bird dog' : 'Peso muerto rumano', 3, '10', back ? '' : '10 kg'], ['Caminata rápida', 1, '10 min', '']] }
  };
  const pattern = { 2: [0, 3], 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 3, 4], 6: [0, 1, 2, 3, 4, 5] }[e.days] || [0, 2, 4];
  const order = ['sup', 'inf', 'cardio', 'full', 'sup', 'inf'];
  const week = DAYS.map((_, i) => (pattern.includes(i) ? R[order[pattern.indexOf(i)]] : null));
  const notes = [];
  if (knee) notes.push('Sin saltos ni sentadilla profunda por tu lesión de rodilla');
  if (back) notes.push('Sin cargas pesadas sobre la espalda por tu lesión');
  if (heart) notes.push('Intensidad moderada y sin contener la respiración');
  if (e.conditions.includes('Diabetes tipo 2')) notes.push('Carbohidratos repartidos en las 4 comidas');
  if (e.stress >= 4) notes.push('Estrés alto: 5 min de respiración al terminar');
  if (e.sleep < 7) notes.push('Duermes menos de 7 h: descansos más largos entre series');
  return { bmi, bmiCat, kcal, protein, fat, carbs, week, pattern, notes };
}

/* ---------- Evaluación física (the user copies the doctor's results) ---------- */
const STEPS = ['Medidas', 'Salud', 'Alimentación', 'Estilo de vida', 'Meta', 'Revisión'];
function Evaluation({ initial, editing, onDone, onExit }) {
  const [e, setE] = useState(initial);
  const [step, setStep] = useState(0);
  const body = useRef(null);
  const set = (k, v) => setE((p) => ({ ...p, [k]: v }));
  const toggle = (k, v) => setE((p) => ({ ...p, [k]: p[k].includes(v) ? p[k].filter((x) => x !== v) : [...p[k], v] }));
  const plan = computePlan(e);
  const goStep = (s) => { setStep(s); if (body.current) body.current.scrollTop = 0; };
  const valid = [e.weight > 0 && e.height > 0 && e.age > 0, true, true, true, e.target > 0, true][step];

  return (
    <div className="screen-in flex h-full flex-col text-white" style={{ background: BLEND_BG }}>
      <div className="px-5 pt-5">
        <div className="flex items-center gap-2">
          <button type="button" aria-label="Atrás" onClick={() => (step ? goStep(step - 1) : onExit())} className="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 hover:bg-white/20"><Icon n="back" /></button>
          <div className="min-w-0 flex-1">
            <div className="text-[11px] font-bold tracking-[1.6px] text-[#67E8F9]">{editing ? 'ACTUALIZAR EVALUACIÓN' : 'EVALUACIÓN FÍSICA'} · PASO {step + 1} DE {STEPS.length}</div>
            <h1 className="font-display text-[22px] font-extrabold leading-tight">{STEPS[step]}</h1>
          </div>
        </div>
        <div className="mt-3 grid grid-cols-6 gap-1.5" aria-hidden="true">
          {STEPS.map((s, i) => <div key={s} className={`h-1.5 rounded-full ${i <= step ? 'bg-[#22D3EE]' : 'bg-white/15'}`} />)}
        </div>
      </div>

      <div ref={body} className="no-scrollbar flex-1 overflow-y-auto px-5 pb-4 pt-4">
        {step === 0 && (
          <div className="flex flex-col gap-4">
            <div className="glass flex items-start gap-3 rounded-2xl p-3.5 text-[13px] leading-snug text-[#DCE7F7]">
              <Icon n="clipboard" s={20} className="mt-px shrink-0 text-[#67E8F9]" />
              Copia aquí los resultados de tu evaluación con el médico. El iCoach los usa para crear tus entrenamientos y tu plan de comidas.
            </div>
            <div className="grid grid-cols-2 gap-3">
              <NumField id="ev-w" label="Peso actual" unit="kg" step={0.1} value={e.weight} onChange={(v) => set('weight', v)} />
              <NumField id="ev-h" label="Estatura" unit="cm" value={e.height} onChange={(v) => set('height', v)} />
              <NumField id="ev-a" label="Edad" unit="años" value={e.age} onChange={(v) => set('age', v)} />
              <div className="flex min-w-0 flex-col gap-1.5">
                <label htmlFor="ev-date" className="text-[13px] font-semibold text-[#DCE7F7]">Fecha de la evaluación</label>
                <input id="ev-date" type="date" value={e.date} onChange={(ev) => set('date', ev.target.value)}
                  className="h-[52px] w-full rounded-[14px] border border-transparent bg-white/95 px-3 text-[15px] font-semibold text-ink outline-none focus:border-[#22D3EE] focus:ring-4 focus:ring-[#22D3EE]/25" />
              </div>
            </div>
            <div className="flex flex-col gap-2"><Label>Sexo</Label><Choice options={['Femenino', 'Masculino']} value={e.sex} onPick={(v) => set('sex', v)} cols="grid grid-cols-2 gap-2" /></div>
            <div className="glass flex items-center justify-between rounded-2xl p-4">
              <div><div className="text-[12px] font-semibold text-[#9FB0C8]">Índice de masa corporal</div><div className="font-display text-[26px] font-extrabold tnum">{plan.bmi.toFixed(1)}</div></div>
              <Chip tone={plan.bmiCat === 'Saludable' ? 'green' : 'orange'}>{plan.bmiCat}</Chip>
            </div>
          </div>
        )}
        {step === 1 && (
          <div className="flex flex-col gap-5">
            <div className="flex flex-col gap-2">
              <Label hint="Marca lo que indicó tu médico. Si no tienes ninguna, déjalo vacío.">Condiciones de salud</Label>
              <Choice multi options={CONDITIONS} value={e.conditions} onPick={(v) => toggle('conditions', v)} />
            </div>
            <div className="grid grid-cols-2 gap-3">
              <NumField id="ev-sys" label="Presión sistólica" unit="mmHg" value={e.bpSys} onChange={(v) => set('bpSys', v)} />
              <NumField id="ev-dia" label="Presión diastólica" unit="mmHg" value={e.bpDia} onChange={(v) => set('bpDia', v)} />
              <NumField id="ev-rhr" label="Pulso en reposo" unit="lpm" value={e.rhr} onChange={(v) => set('rhr', v)} />

const NAV = [['inicio', 'home', 'Inicio'], ['entrenamientos', 'dumbbell', 'Entrenamientos'], ['nutricion', 'food', 'Nutrición'], ['progreso', 'chart', 'Progreso'], ['perfil', 'user', 'Perfil']];

function WeightChart({ points, target }) {
  const W = 320, H = 160, L = 34, R = 10, T = 12, B = 26;
  const vals = [...points, target];
  const min = Math.floor(Math.min(...vals) - 1), max = Math.ceil(Math.max(...vals) + 1);
  const x = (i) => L + i * (W - L - R) / (points.length - 1);
  const y = (v) => T + (max - v) / (max - min) * (H - T - B);
  const d = points.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const ticks = [min, Math.round((min + max) / 2), max];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label={`Peso de las últimas ${points.length} semanas, de ${points[0]} a ${points[points.length - 1]} kg; meta ${target} kg`}>
      <defs><linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#22D3EE" stopOpacity=".28" /><stop offset="1" stopColor="#22D3EE" stopOpacity="0" /></linearGradient></defs>
      {ticks.map((t) => <g key={t}><line x1={L} x2={W - R} y1={y(t)} y2={y(t)} stroke="rgba(255,255,255,.08)" /><text x={L - 6} y={y(t) + 4} textAnchor="end" fontSize="10" fill="#9FB0C8">{t}</text></g>)}
      <line x1={L} x2={W - R} y1={y(target)} y2={y(target)} stroke="#FF7A45" strokeDasharray="5 4" strokeWidth="1.5" />
      <text x={W - R} y={y(target) - 5} textAnchor="end" fontSize="10" fontWeight="700" fill="#FFA585">Meta {target} kg</text>
      <path d={`${d} L${x(points.length - 1)} ${H - B} L${x(0)} ${H - B} Z`} fill="url(#wfill)" />
      <path d={d} fill="none" stroke="#22D3EE" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r={i === points.length - 1 ? 5 : 2.5} fill={i === points.length - 1 ? '#FFFFFF' : '#22D3EE'} stroke="#22D3EE" strokeWidth="2" />)}
      {points.map((_, i) => <text key={'l' + i} x={x(i)} y={H - 8} textAnchor="middle" fontSize="10" fill="#9FB0C8">S{i + 1}</text>)}
    </svg>
  );
}

function Dashboard({ name, e, plan, hw, linked, setLinked, st, setSt, onLogout, onEditEval }) {
  const [tab, setTab] = useState('inicio');
  const [foodOpen, setFoodOpen] = useState(false);
  const [rest, setRest] = useState(0);
  const [selDay, setSelDay] = useState(plan.week[TODAY] ? TODAY : (plan.pattern.find((i) => i > TODAY) ?? plan.pattern[0]));
  const [newW, setNewW] = useState('');
  const [toast, setToast] = useState('');
  const scroller = useRef(null);

  useEffect(() => { if (scroller.current) scroller.current.scrollTop = 0; }, [tab]);
  useEffect(() => { if (rest <= 0) return; const id = setTimeout(() => setRest(rest - 1), 1000); return () => clearTimeout(id); }, [rest]);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(''), 2200); return () => clearTimeout(id); }, [toast]);

  const todayR = plan.week[TODAY];
  const setsOf = (d, i) => st.sets[`${d}-${i}`] || 0;
  const doneOf = (d) => plan.week[d] ? plan.week[d].ex.every((x, i) => setsOf(d, i) >= x[1]) : false;
  const totalSets = (d) => plan.week[d] ? plan.week[d].ex.reduce((a, x) => a + x[1], 0) : 0;
  const madeSets = (d) => plan.week[d] ? plan.week[d].ex.reduce((a, x, i) => a + Math.min(setsOf(d, i), x[1]), 0) : 0;
  const weekDone = plan.pattern.filter((i) => i < TODAY).length + (todayR && doneOf(TODAY) ? 1 : 0);
  const left = Math.max(e.days - weekDone, 0);

  const dayMeals = SLOTS.map((s) => [s, mealFor(st.day, s, e.allergies)]);
  const extras = st.extra.filter((x) => x.day === st.day);
  const kcal = dayMeals.reduce((a, [s, m]) => a + (st.meals[`${st.day}-${s}`] ? m[1] : 0), 0) + extras.reduce((a, x) => a + x.k, 0);
  const share = kcal / plan.kcal;
  const weights = st.weights;
  const current = weights[weights.length - 1];
  const start = weights[0];
  const wPct = start === e.target ? 1 : (start - current) / (start - e.target);

  const doSet = (d, i) => { setSt({ ...st, sets: { ...st.sets, [`${d}-${i}`]: setsOf(d, i) + 1 } }); setRest(90); };

  const saveWeight = (ev) => { ev.preventDefault(); const v = parseFloat(newW); if (!(v > 20 && v < 300)) return; setSt({ ...st, weights: [...weights.slice(1), v] }); setNewW(''); setToast('Peso guardado'); };
  const coachLine = todayR
    ? `Hoy toca ${todayR.name.toLowerCase()}, ${e.minutes} minutos.`
    : `Hoy es día de descanso activo: camina 20 minutos y estira 10.`;
  const dateLabel = new Date().toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long' });

  return (
    <div className="screen-in relative h-full bg-[#060A14] text-white">

      <div ref={scroller} className="no-scrollbar relative h-full overflow-y-auto pb-28">

            <div className="min-w-0">
              <div className="truncate text-[12.5px] capitalize text-[#9FB0C8]">{dateLabel}</div>
              <div className="font-display text-[19px] font-bold leading-tight">{NAV.find((n) => n[0] === tab)[0] === 'inicio' ? `Hola, ${name}` : NAV.find((n) => n[0] === tab)[2]}</div>

                {[['Entrenamientos', `${weekDone}/${e.days}`], ['Volumen', '4,820 kg'], ['Promedio', `${fmt(plan.kcal - 140)} kcal`]].map(([l, v]) => (
                  <div key={l} className="rounded-2xl bg-white/[.05] px-2 py-3"><div className="font-display text-[17px] font-bold tnum">{v}</div><div className="text-[11.5px] text-[#9FB0C8]">{l}</div></div>
                ))}

          {tab === 'perfil' && <>
            <Panel title="Evaluación física" icon="clipboard" right={<span className="text-[12px] text-[#9FB0C8]">{fmtDate(e.date)}</span>}>
              <div className="grid grid-cols-3 gap-2.5">
                {[['Peso', `${current} kg`], ['Estatura', `${e.height} cm`], ['IMC', plan.bmi.toFixed(1)], ['Presión', `${e.bpSys}/${e.bpDia}`], ['Pulso', `${e.rhr} lpm`], ['Sueño', `${e.sleep} h`]].map(([l, v]) => (
                  <div key={l} className="rounded-2xl bg-white/[.05] p-2.5"><div className="text-[11.5px] text-[#9FB0C8]">{l}</div><div className="font-display text-[15px] font-bold tnum">{v}</div></div>
                ))}
              </div>
              <div className="mt-3 flex flex-col gap-2 text-[12.5px] text-[#9FB0C8]">

                <div className="flex flex-wrap items-center gap-1.5">Alimentación:{e.allergies.length ? e.allergies.map((c) => <Chip key={c} tone="orange">{c}</Chip>) : <Chip tone="green">Sin restricciones</Chip>}</div>
                <div className="flex flex-wrap items-center gap-1.5">Estilo de vida:<Chip tone="gray">Actividad {e.activity.toLowerCase()}</Chip><Chip tone="gray">Estrés {STRESS[e.stress - 1].toLowerCase()}</Chip></div>

              <div className="flex items-center justify-between gap-3">
                <div><div id="bio-sw" className="text-[14px] font-semibold">Entrar con Face ID o Huella</div><div className="text-[12px] text-[#9FB0C8]">{hw === 'none' ? 'Este teléfono no tiene biometría' : linked ? 'Activado' : 'Desactivado'}</div></div>
                <button type="button" role="switch" aria-checked={linked} aria-labelledby="bio-sw" disabled={hw === 'none'} onClick={() => setLinked(!linked)}

              </div>
            </Panel>
            <Panel title="Próximamente" icon="watch" right={<Chip tone="gray">Actualización</Chip>}>
              <p className="text-[13px] leading-snug text-[#9FB0C8]">Conecta tu reloj inteligente para registrar agua y ritmo cardíaco sin escribirlos.</p>
            </Panel>
            <button type="button" onClick={onLogout} className="flex h-12 items-center justify-center gap-2 rounded-2xl border border-white/15 text-[15px] font-semibold text-[#FCA5A5] hover:bg-white/5"><Icon n="logout" s={18} />Cerrar sesión</button>
          </>}
        </div>
      </div>

      {toast && <div role="status" className="pop absolute inset-x-6 top-4 z-30 flex items-center gap-2 rounded-2xl bg-white px-4 py-3 text-[14px] font-semibold text-ink shadow-xl"><Icon n="check" s={18} w={3} className="text-ok" />{toast}</div>}

      <nav aria-label="Secciones" className="absolute inset-x-3 bottom-3 z-20 flex items-center justify-between gap-1 rounded-[26px] border border-white/15 bg-[#0D1628]/85 p-1.5 shadow-[0_14px_34px_-14px_rgba(0,0,0,.7)] backdrop-blur-xl">
        {NAV.map(([k, ic, l]) => (
          <button key={k} type="button" aria-label={l} aria-current={tab === k ? 'page' : undefined} onClick={() => setTab(k)}

      {foodOpen && <FoodSheet allergies={e.allergies} onAdd={addFood} onClose={() => setFoodOpen(false)} />}
    </div>
  );
}

/* ---------- App + review stage ---------- */
const initialState = (e) => ({ sets: {}, meals: { '0-Desayuno': true, '0-Almuerzo': true }, extra: [], weights: makeWeights(e.weight), day: 0 });

function App() {
  const [screen, setScreen] = useState('login');
  const [hw, setHw] = useState('faceid');
  const [linked, setLinked] = useState(false);
  const [sheet, setSheet] = useState(null);
  const [autoNext, setAutoNext] = useState(false);
  const [lang, setLang] = useState('es');
  const [evaluated, setEvaluated] = useState(false);
  const [editing, setEditing] = useState(false);
  const [ev, setEv] = useState(EVAL_SAMPLE);
  const [st, setSt] = useState(() => initialState(EVAL_SAMPLE));
  const timers = useRef([]);
  const name = 'Ana';
  const plan = computePlan(ev);
  const weekDone = plan.pattern.filter((i) => i < TODAY).length;

  const clear = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  const later = (fn, ms) => timers.current.push(setTimeout(fn, ms));
  const go = (s, auto = false) => { clear(); setSheet(null); setAutoNext(auto); setScreen(s); };
  const afterAuth = () => (evaluated ? go('welcome', true) : (setEditing(false), go('evaluation')));
  const scan = (linking) => {
    clear();
    setSheet({ step: 'scan', linking });
    later(() => { setSheet({ step: 'ok', linking }); if (linking) setLinked(true); }, 1700);
    later(afterAuth, 2900);
  };
  const onLogin = () => (hw !== 'none' && !linked ? setSheet({ step: 'link' }) : afterAuth());
  const finishEval = (e) => { setEv(e); setSt((s) => ({ ...s, weights: makeWeights(e.weight) })); setEvaluated(true); go('coach'); };
  const jump = (s) => { if (s === 'welcome' || s === 'dashboard') setEvaluated(true); if (s === 'evaluation') setEditing(evaluated); go(s); };
  const reset = () => { go('login'); setLinked(false); setEvaluated(false); setEv(EVAL_SAMPLE); setSt(initialState(EVAL_SAMPLE)); };

  const tabs = [['login', '1', 'Inicio de sesión', 'Biometría y muñeco'], ['evaluation', '2', 'Evaluación física', 'Resultados del médico → iCoach'], ['welcome', '3', 'Tu meta te espera', 'Bienvenida'], ['dashboard', '4', 'Panel', 'Inicio, entrenamientos, nutrición, progreso, perfil']];
  const active = screen === 'coach' ? 'evaluation' : screen;

  return (
    <div className="mx-auto flex max-w-[1080px] flex-wrap items-start justify-center gap-x-12 gap-y-8">
      <aside className="flex w-full max-w-[400px] flex-col gap-5 lg:sticky lg:top-6 lg:max-w-[340px]">
        <div>
          <div className="text-[12px] font-semibold tracking-[2px] text-[#38B6F5]">PROTOTIPO INTERACTIVO</div>
          <h1 className="mt-1 font-display text-[30px] font-extrabold leading-tight text-[#E6EDF7]">AppFitness<span className="text-energy">RD</span></h1>
          <p className="mt-2 text-[14px] leading-relaxed text-[#94A3B8]">Inicia sesión, registra los resultados de tu evaluación física y deja que el iCoach arme tu plan. También puedes saltar directo a cada pantalla.</p>
        </div>
        <nav aria-label="Pantallas" className="flex flex-col gap-2">
          {tabs.map(([k, num, label, sub]) => (
            <button key={k} type="button" aria-current={active === k ? 'step' : undefined} onClick={() => jump(k)}
              className={`flex items-center gap-3 rounded-2xl border p-3 text-left transition ${active === k ? 'border-[#38B6F5] bg-[#0F2340]' : 'border-[#1E2C44] bg-[#0E1726] hover:bg-[#122038]'}`}>
              <span className={`flex h-9 w-9 shrink-0 items-center justify-center rounded-xl font-display text-[15px] font-bold ${active === k ? 'bg-[#38B6F5] text-[#04121A]' : 'bg-[#13213A] text-[#94A3B8]'}`}>{num}</span>
              <span className="min-w-0"><span className="block text-[14.5px] font-semibold text-[#E6EDF7]">{label}</span><span className="block text-[12.5px] text-[#94A3B8]">{sub}</span></span>
            </button>
          ))}
        </nav>
        <div className="flex flex-col gap-2 rounded-2xl border border-[#1E2C44] bg-[#0E1726] p-3.5">
          <span id="hw-label" className="text-[12.5px] font-semibold text-[#94A3B8]">Hardware del teléfono</span>
          <div role="group" aria-labelledby="hw-label" className="grid grid-cols-3 gap-1.5">
            {[['faceid', 'Face ID'], ['touchid', 'Huella'], ['none', 'Ninguno']].map(([k, l]) => (
              <button key={k} type="button" aria-pressed={hw === k} onClick={() => { setHw(k); setSheet(null); clear(); if (k === 'none') setLinked(false); }}
                className={`h-11 rounded-xl text-[13px] font-semibold transition ${hw === k ? 'bg-[#38B6F5] text-[#04121A]' : 'bg-[#13213A] text-[#CBD5E1] hover:bg-[#1A2B48]'}`}>{l}</button>
            ))}
          </div>
          <div className="mt-1 flex items-center justify-between gap-2 text-[12.5px]">
            <span className="text-[#94A3B8]">Biometría: <b className={linked ? 'text-[#4ADE80]' : 'text-[#CBD5E1]'}>{linked ? 'vinculada' : 'no vinculada'}</b> · Evaluación: <b className={evaluated ? 'text-[#4ADE80]' : 'text-[#CBD5E1]'}>{evaluated ? 'sí' : 'no'}</b></span>
            <button type="button" onClick={reset} className="flex h-9 items-center gap-1.5 rounded-lg px-2 font-semibold text-[#38B6F5] hover:bg-[#13213A]"><Icon n="refresh" s={15} />Reiniciar</button>
          </div>
        </div>
        <p className="text-[12px] leading-relaxed text-[#7C8BA1]">Los datos son de ejemplo (Ana, 72 kg, lesión de rodilla, alergia a mariscos). Cambia la evaluación y verás cómo el iCoach ajusta calorías, comidas y ejercicios. El muñeco y el logo son los de tu diseño original.</p>
      </aside>

      <div className="relative w-full max-w-[410px]">
        <div className="relative h-[864px] w-full rounded-[54px] bg-[#05080F] p-[10px] shadow-[0_40px_90px_-30px_rgba(56,182,245,.35),0_0_0_1px_#1E2C44]">
          <div className="relative h-full w-full overflow-hidden rounded-[44px] bg-[#060A14] text-ink">
            {screen === 'login' && <Login key="login" hw={hw} linked={linked} lang={lang} setLang={setLang} onLogin={onLogin} onBio={() => scan(false)} />}
            {screen === 'evaluation' && <Evaluation key={'ev' + editing} initial={ev} editing={editing} onDone={finishEval} onExit={() => go(evaluated ? 'dashboard' : 'login')} />}
            {screen === 'coach' && <CoachBuild key="coach" e={ev} onDone={() => go('welcome', true)} />}
            {screen === 'welcome' && <Welcome key="welcome" name={name} done={weekDone} goal={ev.days} autoNext={autoNext} onContinue={() => go('dashboard')} />}
            {screen === 'dashboard' && <Dashboard key="dash" name={name} e={ev} plan={plan} hw={hw} linked={linked} setLinked={setLinked} st={st} setSt={setSt} onLogout={() => go('login')} onEditEval={() => { setEditing(true); go('evaluation'); }} />}
            <BioSheet sheet={sheet} hw={hw} onActivate={() => scan(true)} onSkip={afterAuth} />
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
