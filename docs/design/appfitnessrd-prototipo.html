<style>
/* Layout: dark review stage (previous concept) + phone running the blue/white AppFitnessRD UI (current concept) */
:root {
  --stage: #060A14; --panel: #0E1726; --panel-line: #1E2C44; --stage-fg: #E6EDF7; --stage-muted: #94A3B8;
  --brand: #0A66C2; --sky: #38B6F5; --ice: #9BEBFF; --energy: #FF5A36;
  color-scheme: dark;
}
html, body { height: auto; }
body { background: var(--stage); color: var(--stage-fg); font-family: Inter, system-ui, sans-serif; }
h1, h2, h3 { text-wrap: balance; }
.tnum { font-variant-numeric: tabular-nums; }

@keyframes pulseRun { from { stroke-dashoffset: 520 } to { stroke-dashoffset: 0 } }
@keyframes bob { from { transform: translateY(0) } to { transform: translateY(-5px) } }
@keyframes idle { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
@keyframes wave { 0%,100% { transform: rotate(-14deg) } 50% { transform: rotate(12deg) } }
@keyframes beat { 0%,100% { transform: scale(1) } 12% { transform: scale(1.12) } 24% { transform: scale(1) } 36% { transform: scale(1.07) } }
@keyframes scanLine { 0% { top: 12% } 50% { top: 82% } 100% { top: 12% } }
@keyframes fillUp { from { clip-path: inset(100% 0 0 0) } to { clip-path: inset(0 0 0 0) } }
@keyframes screenIn { from { opacity: .35; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes progress { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.08); opacity: 1 } 100% { transform: scale(1) } }

.pulse-run { stroke-dasharray: 150 370; animation: pulseRun 2.4s linear infinite; }
.pulse-fast { stroke-dasharray: 90 430; animation: pulseRun 1.3s linear infinite; }
.mz-run { animation: bob .42s ease-in-out infinite alternate; }
.mz-idle { animation: idle 2.6s ease-in-out infinite; }
.mz-wave { animation: wave 1.1s ease-in-out infinite; }
.beat { transform-origin: center; animation: beat 1.6s ease-in-out infinite; }
.scan-line { animation: scanLine 1.6s ease-in-out infinite; }
.fill-up { animation: fillUp 1.5s ease-out forwards; }
.screen-in { animation: screenIn .45s cubic-bezier(.2,.8,.2,1) both; }
.sheet-up { animation: sheetUp .38s cubic-bezier(.2,.8,.2,1) both; }
.fade-in { animation: fade .25s ease both; }
.spin { animation: spin .8s linear infinite; }
.auto-progress { transform-origin: left; animation: progress 5s linear forwards; }
.pop { animation: pop .45s cubic-bezier(.2,.8,.2,1) both; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { scrollbar-width: none; }
.art-fade {
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 42%, #000 58%, transparent 100%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 42%, #000 58%, transparent 100%);
}
/* Hero art: long fade at the bottom and soft sides so it melts into the background with no dividing line */
.art-hero {
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 42%, rgba(0,0,0,.55) 68%, transparent 96%), linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to bottom, #000 0%, #000 42%, rgba(0,0,0,.55) 68%, transparent 96%), linear-gradient(to right, transparent 0%, #000 10%, #000 90%, transparent 100%);
  mask-composite: intersect;
}
/* Visible horizontal slider for chip rows */
.thin-scroll { scrollbar-width: thin; scrollbar-color: rgba(103,232,249,.6) rgba(255,255,255,.08); }
.thin-scroll::-webkit-scrollbar { height: 6px; }
.thin-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,.08); border-radius: 9px; margin-inline: 16px; }
.thin-scroll::-webkit-scrollbar-thumb { background: rgba(103,232,249,.6); border-radius: 9px; }
.grad-text { background: linear-gradient(90deg, #67E8F9, #FF7A45); -webkit-background-clip: text; background-clip: text; color: transparent; }
.glass { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .pulse-run, .pulse-fast, .mz-run, .mz-idle, .mz-wave, .beat, .scan-line, .screen-in, .sheet-up, .pop { animation: none !important; }
  .fill-up { animation: none; clip-path: none; }
}
.stage-wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

/* ---------- Icons ---------- */
const ICONS = {
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  finger: '<path d="M12 11v3a8 8 0 0 1-1 4"/><path d="M8 12a4 4 0 0 1 8 0v1"/><path d="M5 10a7 7 0 0 1 14 0v3"/><path d="M16 17a14 14 0 0 1-.5 3"/><path d="M8 16a12 12 0 0 1-1 4"/>',
  face: '<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9v1M15 9v1M12 9v4h-1M9 16c1.7 1.3 4.3 1.3 6 0"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  check: '<path d="M5 12l5 5 9-10"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2z"/><path d="M10 20a2 2 0 0 0 4 0"/>',

  heart: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  steps: '<path d="M4 16v-2.4C4 11.5 3 10.5 3 8c0-2.7 1.5-6 4.5-6C9.4 2 10 3.8 10 5.5c0 3.1-2 5.7-2 8.7V16a2 2 0 1 1-4 0z"/><path d="M20 20v-2.4c0-2.1 1-3.1 1-5.6 0-2.7-1.5-6-4.5-6C14.6 6 14 7.8 14 9.5c0 3.1 2 5.7 2 8.7V20a2 2 0 1 0 4 0z"/>',
  flame: '<path d="M12 3s5 4.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 0 2 1 3 2 3 0-3 .5-5.5.5-8z"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  play: '<path d="M7 5l12 7-12 7z"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  scale: '<path d="M5 20h14a1 1 0 0 0 1-1L18 7H6L4 19a1 1 0 0 0 1 1z"/><path d="M9 11a3 3 0 0 1 6 0"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="m9 12 2 2 4-4"/>',
  target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  gauge: '<path d="M4 18a9 9 0 1 1 16 0"/><path d="M12 14l4-5"/>',
  refresh: '<path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4"/>',
  sparkle: '<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/>',
  watch: '<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3M12 10v2l1.5 1"/>',
  clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  back: '<path d="m15 6-6 6 6 6"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>',
  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
function Icon({ n, s = 20, w = 2, className = '' }) {
  return <svg aria-hidden="true" width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={w}
    strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: ICONS[n] }} />;
}

/* ---------- Brand pieces ---------- */
const PULSE = 'M0 28H96L106 28L116 10L128 50L140 4L152 42L162 28H232L242 28L250 16L260 40L268 28H342';
function Pulse({ id, h = 56, track = 'rgba(255,255,255,.28)', stops = ['#FFFFFF', '#9BEBFF', '#FF5A36'], fast = false, className = '' }) {
  return (
    <svg aria-hidden="true" viewBox="0 0 342 56" width="100%" height={h} preserveAspectRatio="none" className={className}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="342" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0" stopColor={stops[0]} /><stop offset=".55" stopColor={stops[1]} /><stop offset="1" stopColor={stops[2]} />
        </linearGradient>
      </defs>
      <path d={PULSE} stroke={track} strokeWidth="2" fill="none" strokeLinejoin="round" />
      <path className={fast ? 'pulse-fast' : 'pulse-run'} d={PULSE} stroke={`url(#${id})`} strokeWidth="3.4" fill="none" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Ring({ value, max, size = 120, sw = 12, color = '#FF5A36', track = '#E3EAF4', children }) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, pct = Math.min(value / max, 1);
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90" aria-hidden="true">
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={sw} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c * (1 - pct)} style={{ transition: 'stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)' }} />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">{children}</div>
    </div>
  );
}

const HERO_BG = 'linear-gradient(160deg, #0A3FA8 0%, #1279E0 55%, #38B6F5 100%)';
const bioName = (hw) => (hw === 'faceid' ? 'Face ID' : 'tu huella');
const bioTitle = (hw) => (hw === 'faceid' ? 'Face ID' : 'Huella digital');

/* Blend: the blue glow of the original AppFitnessRD art melting into the dark navy of the first concept, no hard edge */
const BLEND_BG = [
  'radial-gradient(120% 55% at 50% 0%, #1F8BF0 0%, #0B4FC4 40%, rgba(11,79,196,0) 72%)',
  'radial-gradient(60% 35% at 100% 72%, rgba(255,90,54,.20), transparent 70%)',
  'radial-gradient(70% 40% at 0% 88%, rgba(34,211,238,.16), transparent 70%)',
  'linear-gradient(180deg, #0A3FA8 0%, #0A2A6E 38%, #08142E 68%, #060A14 100%)'
].join(',');
const BTN_BG = 'linear-gradient(90deg, #0A57C2, #0C8DDB)';

/* El Muñeco + logo: the user's original artwork, cropped with CSS */
const ART = { src: 'muneco.webp', w: 941, h: 1672, crops: { full: [0, 0, 941, 515], runner: [330, 85, 360, 220] } };
function Art({ crop = 'full', width = '100%', className = '', style = {} }) {
  const [x, y, w, h] = ART.crops[crop];
  return (
    <div role="img" aria-label="El Muñeco de AppFitnessRD" className={className} style={{
      width, aspectRatio: `${w} / ${h}`, maxWidth: '100%',
      backgroundImage: `url(${ART.src})`, backgroundRepeat: 'no-repeat',
      backgroundSize: `${ART.w / w * 100}% auto`,
      backgroundPosition: `${ART.w === w ? 0 : x / (ART.w - w) * 100}% ${y / (ART.h - h) * 100}%`,
      ...style
    }} />
  );
}

/* ---------- Login ---------- */
const T = {
  es: {
    h1a: 'Cada latido', h1b: 'cuenta.', sub: 'Inicia sesión y sigue hacia tu meta.',
    email: 'Correo electrónico', pw: 'Contraseña', forgot: '¿La olvidaste?', signin: 'Iniciar sesión',
    bioEnter: (hw) => (hw === 'faceid' ? 'Entrar con Face ID' : 'Entrar con tu huella'),
    bioHint: () => 'Podrás activar Face ID o Huella al iniciar sesión.',
    newHere: '¿Nuevo aquí?', create: 'Crea una cuenta', lang: 'Idioma', err: 'Escribe tu correo y tu contraseña.',
    show: 'Mostrar contraseña', hide: 'Ocultar contraseña'
  },
  en: {
    h1a: 'Every beat', h1b: 'counts.', sub: 'Sign in and keep moving toward your goal.',
    email: 'Email', pw: 'Password', forgot: 'Forgot it?', signin: 'Sign in',
    bioEnter: (hw) => (hw === 'faceid' ? 'Sign in with Face ID' : 'Sign in with fingerprint'),
    bioHint: () => 'You can turn on Face ID or fingerprint when you sign in.',
    newHere: 'New here?', create: 'Create an account', lang: 'Language', err: 'Enter your email and password.',
    show: 'Show password', hide: 'Hide password'
  }
};
const INPUT = 'h-[52px] w-full rounded-[14px] border border-transparent bg-white/95 pl-[46px] text-[15px] font-medium text-ink outline-none transition focus:border-[#22D3EE] focus:bg-white focus:ring-4 focus:ring-[#22D3EE]/25';

function Login({ hw, linked, lang, setLang, onLogin, onBio }) {
  const t = T[lang];
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const canBio = hw !== 'none';

  const submit = (e) => {
    e.preventDefault();
    if (!email.trim() || !pw) { setErr(t.err); return; }
    setErr(''); setLoading(true);
    setTimeout(() => { setLoading(false); onLogin(); }, 900);
  };

  return (
    <div className="screen-in no-scrollbar flex h-full flex-col overflow-y-auto pb-6 text-white" style={{ background: BLEND_BG }}>
      <Art className="art-hero shrink-0" />
      <Pulse id="pl-login" h={34} className="-mt-4 shrink-0" track="rgba(255,255,255,.14)" stops={['#22D3EE', '#9BEBFF', '#FF5A36']} />
      <div className="mt-1 px-6">
        <h1 className="font-display text-[28px] font-extrabold leading-tight tracking-[-0.8px]">{t.h1a} <span className="grad-text">{t.h1b}</span></h1>
        <p className="mt-1 text-[14px] text-[#C7D7F0]">{t.sub}</p>
      </div>

      <form onSubmit={submit} noValidate className="glass relative mx-4 mt-4 flex flex-col gap-3 rounded-[28px] p-5 shadow-[0_24px_60px_-24px_rgba(0,0,0,.65)]">
        <div className="flex flex-col gap-1.5">
          <label htmlFor="lg-email" className="text-[13px] font-semibold text-[#DCE7F7]">{t.email}</label>
          <div className="relative">
            <Icon n="mail" s={18} className="absolute left-4 top-[17px] text-[#6B7A90]" />
            <input id="lg-email" type="email" autoComplete="email" value={email} onChange={(e) => setEmail(e.target.value)} className={`${INPUT} pr-4`} />
          </div>
        </div>
        <div className="flex flex-col gap-1.5">
          <div className="flex items-baseline justify-between">
            <label htmlFor="lg-pass" className="text-[13px] font-semibold text-[#DCE7F7]">{t.pw}</label>
            <a href="#" onClick={(e) => e.preventDefault()} className="text-[13px] font-semibold text-[#67E8F9] hover:text-white">{t.forgot}</a>
          </div>
          <div className="relative">
            <Icon n="lock" s={18} className="absolute left-4 top-[17px] text-[#6B7A90]" />
            <input id="lg-pass" type={showPw ? 'text' : 'password'} autoComplete="current-password" value={pw} onChange={(e) => setPw(e.target.value)} className={`${INPUT} pr-[52px]`} />
            <button type="button" aria-label={showPw ? t.hide : t.show} onClick={() => setShowPw(!showPw)}
              className="absolute right-1 top-1 flex h-11 w-11 items-center justify-center rounded-[10px] text-muted hover:bg-field">
              <Icon n={showPw ? 'eyeOff' : 'eye'} />
            </button>
          </div>
        </div>
        {err && <p role="alert" className="text-[13px] font-medium text-[#FCA5A5]">{err}</p>}

        <div className="mt-1 flex gap-2.5">
          <button type="submit" disabled={loading} style={{ background: BTN_BG }}
            className="flex h-14 flex-1 items-center justify-center gap-2.5 rounded-2xl font-display text-[16px] font-bold text-white shadow-[0_12px_30px_-10px_rgba(34,211,238,.6)] transition hover:-translate-y-px hover:brightness-110 disabled:opacity-80">
            {loading ? <span className="spin h-5 w-5 rounded-full border-[3px] border-white/40 border-t-white" /> : <>{t.signin}<Icon n="arrow" s={18} w={2.6} /></>}
          </button>
          {canBio && linked && (
            <button type="button" aria-label={t.bioEnter(hw)} onClick={onBio}
              className="flex h-14 w-14 items-center justify-center rounded-2xl border-[1.5px] border-[#FF7A45] bg-white/5 text-[#FF9A75] transition hover:bg-white/10">
              <Icon n={hw === 'faceid' ? 'face' : 'finger'} s={26} />
            </button>
          )}
        </div>
        {canBio && linked && (
          <button type="button" onClick={onBio} className="text-[13px] font-semibold text-[#FF9A75] hover:text-white">{t.bioEnter(hw)}</button>
        )}
        {canBio && !linked && (
          <div className="flex items-center gap-2 rounded-xl bg-white/[.06] px-3 py-2.5 text-[12.5px] leading-snug text-[#C7D7F0]">
            <Icon n={hw === 'faceid' ? 'face' : 'finger'} s={18} className="shrink-0 text-[#67E8F9]" />{t.bioHint(hw)}
          </div>
        )}

        <div className="flex items-center gap-3 text-[13px] text-[#AFC2DD]">
          <div className="h-px flex-1 bg-white/15" />{t.newHere}<div className="h-px flex-1 bg-white/15" />
        </div>
        <a href="#" onClick={(e) => e.preventDefault()}
          className="flex h-12 items-center justify-center rounded-2xl border border-white/20 bg-white/5 text-[15px] font-semibold text-white transition hover:bg-white/10">{t.create}</a>
      </form>

      <div className="mx-6 mt-4 flex items-center justify-between gap-3">
        <span id="lg-lang" className="text-[13px] font-semibold text-[#DCE7F7]">{t.lang}</span>
        <div role="group" aria-labelledby="lg-lang" className="flex gap-2">

  const lowerLeg = ['Tobillo', 'Periostitis tibial', 'Fascitis plantar'].some((x) => inj.includes(x));
  const heart = e.conditions.includes('Hipertensión') || e.conditions.includes('Condición cardíaca');
  const R = {
    sup: { name: 'Fuerza · tren superior', ex: [['Press de pecho con mancuernas', 4, '10', '12 kg'], ['Remo con mancuerna', 4, '12', '10 kg'], (shoulder ? ['Rotación externa con banda', 3, '15', 'Banda ligera'] : ['Press militar sentado', 3, '10', '6 kg']), ['Jalón con banda elástica', 3, '15', 'Banda media'], ['Plancha', 3, '40 s', '']] },
    inf: { name: 'Fuerza · tren inferior', ex: knee
      ? [['Puente de glúteo', 4, '12', '14 kg'], ['Peso muerto rumano', 4, '10', '10 kg'], ['Abducción con banda', 3, '15', 'Banda media'], ['Elevación de talones', 3, '15', ''], ['Bicicleta estática suave', 1, '10 min', '']]
      : [['Sentadilla goblet', 4, '10', '12 kg'], ['Zancadas', 3, '10', '6 kg'], ['Peso muerto rumano', 4, '10', '10 kg'], ['Elevación de talones', 3, '15', ''], ['Plancha lateral', 3, '30 s', '']] },
    cardio: { name: 'Cardio y core', ex: [[knee || lowerLeg ? 'Bicicleta estática' : 'Trote suave', 1, '20 min', ''], ['Bird dog', 3, '12', ''], ['Dead bug', 3, '12', ''], ['Plancha', 3, '40 s', '']] },
    full: { name: 'Cuerpo completo', ex: [['Remo con banda', 3, '12', 'Banda media'], [knee ? 'Puente de glúteo' : 'Sentadilla goblet', 3, '12', '10 kg'], ['Flexiones inclinadas', 3, '10', ''], [back ? 'Bird dog' : 'Peso muerto rumano', 3, '10', back ? '' : '10 kg'], ['Caminata rápida', 1, '10 min', '']] }
  };
  const pattern = { 2: [0, 3], 3: [0, 2, 4], 4: [0, 1, 3, 4], 5: [0, 1, 2, 3, 4], 6: [0, 1, 2, 3, 4, 5] }[e.days] || [0, 2, 4];
  const order = ['sup', 'inf', 'cardio', 'full', 'sup', 'inf'];
  const week = DAYS.map((_, i) => (pattern.includes(i) ? R[order[pattern.indexOf(i)]] : null));
  const notes = [];
  if (knee) notes.push('Sin saltos ni sentadilla profunda por tu lesión de rodilla');
  if (back) notes.push('Sin cargas pesadas sobre la espalda por tu lesión');
  if (shoulder) notes.push('Sin press por encima de la cabeza por tu lesión de hombro');
  if (lowerLeg) notes.push('Sin trote ni saltos: el cardio será en bicicleta');
  const otherInj = inj.filter((x) => !['Rodilla', 'Espalda baja', 'Hombro', 'Tobillo', 'Periostitis tibial', 'Fascitis plantar', 'Otra lesión'].includes(x));
  if (otherInj.length) notes.push(`Cargas moderadas por tu lesión de ${otherInj.join(', ').toLowerCase()}`);
  if (inj.includes('Otra lesión') && e.otherInjury) notes.push(`Tomando en cuenta tu lesión: ${e.otherInjury}`);
  if (heart) notes.push('Intensidad moderada y sin contener la respiración');
  if (e.conditions.includes('Diabetes')) notes.push('Carbohidratos repartidos en las 4 comidas');
  if (e.conditions.includes('Otros') && e.otherCondition) notes.push(`Tomando en cuenta: ${e.otherCondition}`);
  if (e.stress >= 4) notes.push('Estrés alto: 5 min de respiración al terminar');
  if (e.sleep < 7) notes.push('Duermes menos de 7 h: descansos más largos entre series');
  return { bmi, bmiCat, kcal, protein, fat, carbs, week, pattern, notes };
}

function WeightChart({ points, target }) {
  const W = 320, H = 160, L = 34, R = 10, T = 12, B = 26;
  const vals = [...points, target];
  const min = Math.floor(Math.min(...vals) - 1), max = Math.ceil(Math.max(...vals) + 1);
  const x = (i) => L + i * (W - L - R) / (points.length - 1);
  const y = (v) => T + (max - v) / (max - min) * (H - T - B);
  const d = points.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const ticks = [min, Math.round((min + max) / 2), max];
  return (
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label={`Peso de las últimas ${points.length} semanas, de ${points[0]} a ${points[points.length - 1]} kg; meta ${target} kg`}>
      <defs><linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#22D3EE" stopOpacity=".28" /><stop offset="1" stopColor="#22D3EE" stopOpacity="0" /></linearGradient></defs>
      {ticks.map((t) => <g key={t}><line x1={L} x2={W - R} y1={y(t)} y2={y(t)} stroke="rgba(255,255,255,.08)" /><text x={L - 6} y={y(t) + 4} textAnchor="end" fontSize="10" fill="#9FB0C8">{t}</text></g>)}
      <line x1={L} x2={W - R} y1={y(target)} y2={y(target)} stroke="#FF7A45" strokeDasharray="5 4" strokeWidth="1.5" />
      <text x={W - R} y={y(target) - 5} textAnchor="end" fontSize="10" fontWeight="700" fill="#FFA585">Meta {target} kg</text>
      <path d={`${d} L${x(points.length - 1)} ${H - B} L${x(0)} ${H - B} Z`} fill="url(#wfill)" />
      <path d={d} fill="none" stroke="#22D3EE" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((v, i) => <circle key={i} cx={x(i)} cy={y(v)} r={i === points.length - 1 ? 5 : 2.5} fill={i === points.length - 1 ? '#FFFFFF' : '#22D3EE'} stroke="#22D3EE" strokeWidth="2" />)}
      {points.map((_, i) => <text key={'l' + i} x={x(i)} y={H - 8} textAnchor="middle" fontSize="10" fill="#9FB0C8">S{i + 1}</text>)}
    </svg>
  );
}

    <div className="fade-in absolute inset-0 z-40 flex items-end bg-[#060A14]/70">
      <div role="dialog" aria-modal="true" aria-labelledby="food-title" className="sheet-up max-h-[88%] w-full overflow-y-auto rounded-t-[30px] border-t border-white/10 bg-[#0D1628] px-5 pb-6 pt-3 text-white">
        <div className="mx-auto mb-3 h-1.5 w-11 rounded-full bg-white/20" />
        <div className="mb-3 flex items-center justify-between">
          <h2 id="food-title" className="font-display text-[20px] font-bold">Registrar comida</h2>
          <button type="button" aria-label="Cerrar" onClick={onClose} className="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 hover:bg-white/20"><Icon n="x" /></button>
        </div>
        <Choice options={SLOTS} value={slot} onPick={setSlot} cols="grid grid-cols-4 gap-1.5" btnClass="flex items-center justify-center px-1 text-center text-[12.5px]" />
        <div className="relative mt-3">
          <Icon n="search" s={18} className="absolute left-4 top-[17px] text-[#6B7A90]" />
          <label htmlFor="food-q" className="sr-only">Buscar alimento</label>
          <input id="food-q" value={q} onChange={(ev) => { setQ(ev.target.value); setPick(null); }} placeholder="Buscar alimento"
            className="h-[52px] w-full rounded-[14px] bg-white/95 pl-[46px] pr-4 text-[15px] font-medium text-ink outline-none placeholder:text-[#8593A8] focus:ring-4 focus:ring-[#22D3EE]/25" />
        </div>
        <div className="mt-2"><Choice options={cats} value={cat} onPick={(c) => { setCat(c); setQ(''); setPick(null); }} cols="thin-scroll -mx-5 flex gap-2 overflow-x-auto px-5 pb-2.5" btnClass="shrink-0 whitespace-nowrap px-3.5 text-[13.5px]" /></div>
        <ul className="mt-2 flex flex-col">
          {list.map((f) => {
            const bad = blockedBy(f, allergies).length > 0;
            const sel = pick && pick[0] === f[0];
            const fav = favs.includes(f[0]);
            const times = counts[f[0]] || 0;
            return (
              <li key={f[0]} className="flex items-center gap-1">
                <button type="button" aria-pressed={!!sel} onClick={() => { setPick(f); setServ(1); setCreating(false); }}
                  className={`flex min-w-0 flex-1 items-center gap-3 rounded-xl px-3 py-2.5 text-left transition ${sel ? 'bg-[#22D3EE]/[.14]' : 'hover:bg-white/5'}`}>
                  <span className="min-w-0 flex-1">
                    <span className="block text-[14px] font-semibold">{f[0]}</span>
                    <span className="block text-[12px] text-[#9FB0C8] tnum">{f[1]} kcal · {f[5]}{f[3] ? ' · plato' : ''}{f[4] === 'Mis alimentos' ? ' · creado por ti' : ''}{times ? ` · ${times} ${times === 1 ? 'vez' : 'veces'}` : ''}</span>
                  </span>
                  {bad && <Chip tone="orange"><Icon n="alert" s={12} />Excluido</Chip>}
                </button>
                <button type="button" aria-pressed={fav} aria-label={fav ? `Quitar ${f[0]} de favoritos` : `Agregar ${f[0]} a favoritos`} onClick={() => onFav(f[0])}
                  className={`flex h-11 w-11 shrink-0 items-center justify-center rounded-full transition hover:bg-white/10 ${fav ? 'text-[#FBBF24]' : 'text-white/35'}`}>
                  <Icon n="star" s={19} className={fav ? 'fill-current' : ''} />
                </button>
              </li>
            );
          })}
          {!list.length && <li className="px-3 py-3 text-[13.5px] text-[#9FB0C8]">{cat === 'Mis alimentos' && !q ? 'Todavía no has creado alimentos.' : cat === 'Frecuentes' && !q ? 'Marca alimentos con la estrella para tenerlos aquí.' : 'No encontramos ese alimento. Puedes crearlo abajo.'}</li>}
        </ul>
        {!creating ? (
          <button type="button" onClick={() => { setCreating(true); setPick(null); setNf({ ...nf, n: q }); }}
            className="mt-2 flex h-11 w-full items-center justify-center gap-2 rounded-xl border border-dashed border-white/25 text-[13.5px] font-semibold text-[#67E8F9] hover:bg-white/5">
            <Icon n="plus" s={18} />¿No lo encuentras? Crear alimento
          </button>
        ) : (
          <div className="mt-2 flex flex-col gap-2.5 rounded-2xl border border-white/10 bg-white/5 p-3.5">
            <div className="text-[15px] font-bold">Crear alimento</div>
            <div className="flex flex-col gap-1.5">
              <label htmlFor="nf-n" className="text-[13px] font-semibold text-[#DCE7F7]">Nombre</label>
              <input id="nf-n" value={nf.n} onChange={(ev) => setNf({ ...nf, n: ev.target.value })} placeholder="Ej.: Mofongo de pollo" className={FIELD} />
            </div>
            <div className="grid grid-cols-2 gap-2.5">
              <div className="flex min-w-0 flex-col gap-1.5">
                <label htmlFor="nf-p" className="text-[13px] font-semibold text-[#DCE7F7]">Porción</label>
                <input id="nf-p" value={nf.portion} onChange={(ev) => setNf({ ...nf, portion: ev.target.value })} placeholder="1 porción" className={FIELD} />
              </div>
              <NumField id="nf-k" label="Calorías" unit="kcal" value={nf.k} onChange={(v) => setNf({ ...nf, k: v })} />
            </div>
            <p className="text-[12px] leading-snug text-[#9FB0C8]">Se guarda en tu base de alimentos para la próxima vez, y el iCoach lo toma en cuenta en tus planes.</p>
            <div className="grid grid-cols-2 gap-2">
              <button type="button" onClick={() => setCreating(false)} className="h-11 rounded-xl bg-white/10 text-[14px] font-semibold hover:bg-white/20">Cancelar</button>
              <button type="button" onClick={saveNew} disabled={!nf.n.trim() || !(Number(nf.k) > 0)} style={{ background: BTN_BG }} className="h-11 rounded-xl text-[14px] font-bold disabled:opacity-40">Guardar alimento</button>
            </div>
          </div>
        )}
        {pick && (
          <div className="mt-3 rounded-2xl border border-white/10 bg-white/5 p-3.5">
            {blocked.length
              ? <p className="flex items-start gap-2 text-[13px] leading-snug text-[#FFA585]"><Icon n="alert" s={18} className="shrink-0" />Contiene {blocked.join(' y ').toLowerCase()}. Tu evaluación física lo excluye, así que no se puede agregar.</p>
              : <div className="flex items-center justify-between gap-3">
                  <div><div className="text-[12px] text-[#9FB0C8]">Porciones</div><div className="font-display text-[18px] font-bold tnum">{fmt(pick[1] * serv)} kcal</div></div>
                  <div className="flex items-center gap-2">
                    <button type="button" aria-label="Menos porciones" onClick={() => setServ(Math.max(0.5, serv - 0.5))} className="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 hover:bg-white/20"><Icon n="minus" /></button>
                    <span className="w-8 text-center font-display text-[17px] font-bold tnum">{serv}</span>
                    <button type="button" aria-label="Más porciones" onClick={() => setServ(serv + 0.5)} className="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 hover:bg-white/20"><Icon n="plus" /></button>
                  </div>
                </div>}
          </div>
        )}
        <Btn className="mt-4 w-full" disabled={!pick || blocked.length > 0} onClick={() => onAdd({ slot, n: pick[0], k: Math.round(pick[1] * serv), serv })}>Agregar a {slot.toLowerCase()}</Btn>
      </div>
    </div>
  );
}

function Dashboard({ name, e, plan: base, hw, linked, setLinked, st, setSt, onLogout, onEditEval }) {
  const [tab, setTab] = useState('inicio');
  const [foodOpen, setFoodOpen] = useState(false);
  const [rest, setRest] = useState(0);
  const [selDay, setSelDay] = useState(base.week[TODAY] ? TODAY : (base.pattern.find((i) => i > TODAY) ?? base.pattern[0]));
  const [demo, setDemo] = useState(null);
  const [openMeal, setOpenMeal] = useState(null);
  const [notifOpen, setNotifOpen] = useState(false);
  const [readIds, setReadIds] = useState([]);
  const [weekOpen, setWeekOpen] = useState(null);
  const dayRow = useRef(null);
  const [newW, setNewW] = useState('');
  const [toast, setToast] = useState('');
  const scroller = useRef(null);

  useEffect(() => { if (scroller.current) scroller.current.scrollTop = 0; }, [tab]);
  useEffect(() => { if (rest <= 0) return; const id = setTimeout(() => setRest(rest - 1), 1000); return () => clearTimeout(id); }, [rest]);
  useEffect(() => { if (!toast) return; const id = setTimeout(() => setToast(''), 2200); return () => clearTimeout(id); }, [toast]);
  useEffect(() => {
    const row = dayRow.current; const el = row && row.querySelector('[aria-pressed="true"]');
    if (el) row.scrollTo({ left: el.offsetLeft - row.clientWidth / 2 + el.clientWidth / 2, behavior: 'smooth' });
  }, [st.day, tab]);

  /* iCoach recalculation: food logged outside the plan changes the next workout and tomorrow's calories */
  const off = st.extra.filter((x) => x.day === st.day);
  const offKcal = off.reduce((a, x) => a + x.k, 0);
  const planEaten = SLOTS.reduce((a, s) => a + (st.meals[`${st.day}-${s}`] ? mealFor(st.day, s, e.allergies)[1] : 0), 0);
  const excess = planEaten + offKcal - base.kcal;
  const alcohol = off.some((x) => ['Cerveza', 'Ron'].includes(x.n));
  const cardioMin = offKcal && excess > 0 ? Math.min(30, Math.max(10, Math.round(excess / 8 / 5) * 5)) : 0;
  const nextDay = base.pattern.find((i) => i > TODAY) ?? base.pattern[0];
  const plan = { ...base, week: base.week.map((r, i) => (r && cardioMin && i === nextDay ? { ...r, ex: [...r.ex, ['Cardio extra del iCoach', 1, `${cardioMin} min`, 'por calorías extra']] } : r)) };
  const adjust = offKcal ? [
    excess > 0 ? `Comiste ${fmt(excess)} kcal por encima de tu meta de hoy.` : `Registraste ${fmt(offKcal)} kcal fuera del plan y aún te quedan ${fmt(-excess)} kcal.`,
    ...(excess > 0
      ? [`Añadí ${cardioMin} min de cardio suave a tu entrenamiento del ${DAY_NAMES[nextDay].toLowerCase()}.`, `Mañana tu meta será ${fmt(base.kcal - Math.min(300, Math.round(excess / 20) * 10))} kcal para compensar.`]
      : ['Si sigues el plan el resto del día, cierras dentro de tu meta.']),
    ...(alcohol ? ['El alcohol frena tu recuperación: hoy evita el entrenamiento intenso y toma más agua.'] : [])
  ] : [];

  const todayR = plan.week[TODAY];
  const setsOf = (d, i) => st.sets[`${d}-${i}`] || 0;
  const doneOf = (d) => plan.week[d] ? plan.week[d].ex.every((x, i) => setsOf(d, i) >= x[1]) : false;
  const totalSets = (d) => plan.week[d] ? plan.week[d].ex.reduce((a, x) => a + x[1], 0) : 0;
  const madeSets = (d) => plan.week[d] ? plan.week[d].ex.reduce((a, x, i) => a + Math.min(setsOf(d, i), x[1]), 0) : 0;
  const weekDone = plan.pattern.filter((i) => i < TODAY || doneOf(i)).length;
  const left = Math.max(e.days - weekDone, 0);

  const dayMeals = SLOTS.map((s) => [s, mealFor(st.day, s, e.allergies)]);
  const extras = st.extra.filter((x) => x.day === st.day);
  const kcal = dayMeals.reduce((a, [s, m]) => a + (st.meals[`${st.day}-${s}`] ? m[1] : 0), 0) + extras.reduce((a, x) => a + x.k, 0);
  const share = kcal / plan.kcal;
  const weights = st.weights;
  const current = weights[weights.length - 1];
  const start = weights[0];
  const wPct = start === e.target ? 1 : (start - current) / (start - e.target);

  const doSet = (d, i) => { setSt({ ...st, sets: { ...st.sets, [`${d}-${i}`]: setsOf(d, i) + 1 } }); setRest(90); };
  const toggleMeal = (s) => setSt({ ...st, meals: { ...st.meals, [`${st.day}-${s}`]: !st.meals[`${st.day}-${s}`] } });
  const addFood = (f) => { setSt({ ...st, extra: [...st.extra, { ...f, day: st.day }] }); setFoodOpen(false); setToast(`${f.n} agregado`); };
  const saveWeight = (ev) => { ev.preventDefault(); const v = parseFloat(newW); if (!(v > 20 && v < 300)) return; setSt({ ...st, weights: [...weights.slice(1), v] }); setNewW(''); setToast('Peso guardado'); };
  const coachLine = todayR
    ? `Hoy toca ${todayR.name.toLowerCase()}, ${e.minutes} minutos.`
    : `Hoy es día de descanso activo: camina 20 minutos y estira 10.`;
  const dateLabel = new Date().toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long' });
  const notifs = [
    ...(adjust.length ? [{ id: `adj-${st.day}-${offKcal}`, icon: 'sparkle', title: 'iCoach ajustó tu plan', body: adjust[0], time: 'Ahora', tab: 'nutricion' }] : []),
    { id: 'train', icon: 'dumbbell', title: todayR ? 'Hoy toca entrenar' : 'Hoy es día de descanso', body: todayR ? `${todayR.name} · ${e.minutes} min` : 'Camina 20 minutos y estira 10.', time: '7:00 a. m.', tab: 'entrenamientos' },
    { id: 'plan', icon: 'sparkle', title: 'iCoach creó tu plan', body: `${e.days} entrenamientos por semana y ${fmt(base.kcal)} kcal al día, según tu evaluación.`, time: 'Hoy', tab: 'entrenamientos' },
    { id: 'weight', icon: 'scale', title: 'Registra tu peso', body: 'Pésate en ayunas para ver tu progreso de la semana.', time: 'Ayer', tab: 'progreso' },
    { id: 'eval', icon: 'clipboard', title: 'Tu evaluación física', body: 'Actualízala con tu médico cada 3 meses para que el iCoach siga acertando.', time: 'Hace 3 días', tab: 'perfil' }
  ];
  const unread = notifs.filter((n) => !readIds.includes(n.id)).length;

  /* Saved weekly plans (sample history): what the iCoach planned each past week vs what was done */
  const monday = new Date(); monday.setHours(12, 0, 0, 0); monday.setDate(monday.getDate() - TODAY);
  const SAMPLE_DONE = [[true, true, false, true, true, true], [true, true, true, true, true, true], [true, false, true, false, true, true], [true, true, true, false, true, true]];
  const SAMPLE_MEALS = [86, 92, 64, 78], SAMPLE_KCAL = [-80, 40, 260, 110], SAMPLE_INTARGET = [5, 6, 3, 4], SAMPLE_WEIGHT = [-0.4, -0.3, 0.2, -0.4];
  const pastWeeks = [1, 2, 3, 4].map((w, idx) => {
    const start = new Date(monday); start.setDate(monday.getDate() - 7 * w);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    const label = `${start.getDate()} ${start.toLocaleDateString('es-DO', { month: 'short' }).replace('.', '')} – ${end.getDate()} ${end.toLocaleDateString('es-DO', { month: 'short' }).replace('.', '')}`;
    const sessions = base.pattern.map((d, k) => ({ day: d, name: base.week[d].name, done: SAMPLE_DONE[idx][k] }));
    const trained = sessions.filter((s) => s.done).length;
    const score = Math.round((trained / sessions.length) * 50 + SAMPLE_MEALS[idx] / 2);
    return { id: w, label, sessions, trained, meals: SAMPLE_MEALS[idx], avgKcal: base.kcal + SAMPLE_KCAL[idx], inTarget: SAMPLE_INTARGET[idx], weight: SAMPLE_WEIGHT[idx], score };
  });
  const openWeek = pastWeeks.find((w) => w.id === weekOpen);
  const openNotif = (n) => { setReadIds([...readIds, n.id]); setNotifOpen(false); setTab(n.tab); };

  return (
    <div className="screen-in relative h-full bg-[#060A14] text-white">
      <div aria-hidden="true" className="pointer-events-none absolute inset-x-0 top-0 h-[340px]" style={{ background: 'radial-gradient(120% 70% at 50% 0%, rgba(31,139,240,.55), rgba(11,79,196,.25) 45%, transparent 75%)' }} />
      <div ref={scroller} className="no-scrollbar relative h-full overflow-y-auto pb-28">
        <header className="flex items-center justify-between gap-3 px-5 pb-3 pt-5">
          <div className="flex min-w-0 items-center gap-3">
            <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border-2 border-white/30 font-display text-[15px] font-bold" style={{ background: HERO_BG }}>{name.slice(0, 2).toUpperCase()}</div>
            <div className="min-w-0">
              <div className="truncate text-[12.5px] capitalize text-[#9FB0C8]">{dateLabel}</div>
              <div className="font-display text-[19px] font-bold leading-tight">{NAV.find((n) => n[0] === tab)[0] === 'inicio' ? `Hola, ${name}` : NAV.find((n) => n[0] === tab)[2]}</div>
            </div>
          </div>
          <button type="button" aria-label={`Notificaciones${unread ? `, ${unread} sin leer` : ''}`} onClick={() => setNotifOpen(true)} className="relative flex h-11 w-11 items-center justify-center rounded-full border border-white/15 bg-white/[.06] hover:bg-white/10">
            <Icon n="bell" s={19} />
            {unread > 0 && <span className="absolute -right-1 -top-1 flex h-5 min-w-[20px] items-center justify-center rounded-full bg-energy px-1 text-[11px] font-bold text-white tnum">{unread}</span>}
          </button>
        </header>

        <div className="flex flex-col gap-3.5 px-4">
          {tab === 'inicio' && <>
            <section className="relative overflow-hidden rounded-[26px] p-4" style={{ background: HERO_BG }}>
              <img src="muneco-solo.webp" alt="" aria-hidden="true" className="pointer-events-none absolute -right-1 top-1 w-[100px] select-none" />
              <div className="relative flex items-center gap-4">
                <Ring value={weekDone} max={e.days} size={88} sw={10} color={left ? '#FF5A36' : '#22C55E'} track="rgba(255,255,255,.25)">
                  <div className="font-display text-[22px] font-extrabold leading-none tnum">{weekDone}<span className="text-[14px] text-[#CFF4FF]">/{e.days}</span></div>
                </Ring>
                <div className="min-w-0 pr-14">
                  <div className="text-[10.5px] font-bold tracking-[1.6px] text-[#CFF4FF]">ESTA SEMANA</div>
                  <div className="font-display text-[20px] font-extrabold leading-tight">{left ? 'Tu meta te espera' : '¡Semana cumplida!'}</div>
                  <div className="mt-0.5 text-[13px] leading-snug text-[#E3F0FF]">{left ? `${left === 1 ? 'Falta 1 entrenamiento' : `Faltan ${left} entrenamientos`}` : 'Hiciste todos tus entrenamientos'}</div>
                </div>
              </div>
              <div className="relative mt-3 flex items-center justify-between text-[12.5px] font-semibold text-[#E3F0FF] tnum">
                <span>{e.goal}</span><span>{current} kg → {e.target} kg</span>
              </div>
              <div className="relative mt-1.5"><Bar pct={wPct} color="#FFFFFF" /></div>
              <Pulse id="pl-dash" h={30} className="relative mt-1" />
            </section>

            <Panel title="iCoach" icon="sparkle" right={<Chip>Recomendación de hoy</Chip>}>
              <p className="text-[15px] font-semibold leading-snug">{coachLine}</p>
              {plan.notes.length > 0 && (
                <ul className="mt-2.5 flex flex-col gap-1.5">
                  {plan.notes.slice(0, 3).map((n) => <li key={n} className="flex items-start gap-2 text-[13px] leading-snug text-[#C7D7F0]"><Icon n="check" s={15} w={2.6} className="mt-0.5 shrink-0 text-[#67E8F9]" />{n}</li>)}
                </ul>
              )}
              {adjust.length > 0 && (
                <div className="mt-3 rounded-2xl border border-[#FF7A45]/40 bg-[#FF7A45]/[.10] p-3 text-[13px] leading-snug text-[#FFD9CC]">
                  <div className="mb-1 font-bold text-[#FFA585]">Ajuste por comidas fuera del plan</div>
                  {adjust.map((a) => <p key={a}>{a}</p>)}
                </div>
              )}
              <div className="mt-3 flex flex-wrap items-center justify-between gap-2">
                <span className="text-[11.5px] text-[#9FB0C8]">Según tu evaluación del {fmtDate(e.date)}</span>
                {left === 0
                  ? <Chip tone="green"><Icon n="check" s={12} w={3} />Entrenamientos de esta semana completados</Chip>
                  : todayR && doneOf(TODAY)
                    ? <Chip tone="green"><Icon n="check" s={12} w={3} />Entrenamiento de hoy completado</Chip>
                    : todayR && <button type="button" onClick={() => { setSelDay(TODAY); setTab('entrenamientos'); }} className="flex h-10 items-center gap-1.5 rounded-xl bg-white/10 px-3 text-[13px] font-semibold hover:bg-white/20">Empezar<Icon n="arrow" s={15} /></button>}
              </div>
            </Panel>

            <div className="grid grid-cols-2 gap-3">
              <button type="button" onClick={() => { setSelDay(TODAY); setTab('entrenamientos'); }} className="flex flex-col gap-2 rounded-[22px] border border-white/10 bg-white/[.05] p-3.5 text-left hover:bg-white/[.08]">
                <span className="flex items-center gap-2 text-[12.5px] font-semibold text-[#9FB0C8]"><Icon n="dumbbell" s={16} className="text-[#67E8F9]" />Entrenamiento</span>
                <span className="font-display text-[20px] font-bold leading-none tnum">{todayR ? `${madeSets(TODAY)}/${totalSets(TODAY)}` : 'Descanso'}<span className="ml-1 text-[12px] font-semibold text-[#9FB0C8]">{todayR ? 'series' : ''}</span></span>
                <Bar pct={todayR ? madeSets(TODAY) / totalSets(TODAY) : 1} />
              </button>
              <button type="button" onClick={() => setTab('nutricion')} className="flex flex-col gap-2 rounded-[22px] border border-white/10 bg-white/[.05] p-3.5 text-left hover:bg-white/[.08]">
                <span className="flex items-center gap-2 text-[12.5px] font-semibold text-[#9FB0C8]"><Icon n="flame" s={16} className="text-[#FF7A45]" />Calorías</span>
                <span className="font-display text-[20px] font-bold leading-none tnum">{fmt(kcal)}<span className="ml-1 text-[12px] font-semibold text-[#9FB0C8]">/ {fmt(plan.kcal)}</span></span>
                <Bar pct={share} color="#FF7A45" />
              </button>
            </div>

            <Panel title="Tu evaluación de hoy" icon="clipboard">
              <div className="flex items-center justify-between gap-3 rounded-2xl bg-white/[.05] p-3">
                <div><div className="text-[12px] text-[#9FB0C8]">IMC</div><div className="font-display text-[22px] font-bold tnum">{(current / (e.height / 100) ** 2).toFixed(1)}</div></div>
                <Chip tone={plan.bmiCat === 'Saludable' ? 'green' : 'orange'}>{plan.bmiCat}</Chip>
                <div className="text-right"><div className="text-[12px] text-[#9FB0C8]">Presión</div><div className="font-display text-[17px] font-bold tnum">{e.bpSys}/{e.bpDia}</div></div>
              </div>
              <div className="mt-3 grid grid-cols-3 gap-3">
                {[['Proteína', plan.protein, '#22D3EE'], ['Carbohidratos', plan.carbs, '#3B82F6'], ['Grasas', plan.fat, '#FBBF24']].map(([l, g, c]) => (
                  <div key={l} className="flex min-w-0 flex-col gap-1">
                    <span className="truncate text-[11.5px] font-semibold text-[#9FB0C8]">{l}</span>
                    <span className="text-[13px] font-bold tnum">{Math.round(g * Math.min(share, 1))}<span className="font-medium text-[#9FB0C8]"> / {g} g</span></span>
                    <Bar pct={share} color={c} h={6} />
                  </div>
                ))}
              </div>

        <div className="fade-in absolute inset-0 z-40 flex items-end bg-[#060A14]/70">
          <div role="dialog" aria-modal="true" aria-labelledby="wk-title" className="sheet-up max-h-[90%] w-full overflow-y-auto rounded-t-[30px] border-t border-white/10 bg-[#0D1628] px-5 pb-6 pt-3 text-white">
            <div className="mx-auto mb-3 h-1.5 w-11 rounded-full bg-white/20" />
            <div className="mb-3 flex items-start justify-between gap-3">
              <div>
                <div className="text-[11px] font-bold tracking-[1.5px] text-[#67E8F9]">SEMANA</div>
                <h2 id="wk-title" className="font-display text-[20px] font-bold capitalize">{openWeek.label}</h2>
              </div>
              <button type="button" aria-label="Cerrar" onClick={() => setWeekOpen(null)} className="flex h-11 w-11 items-center justify-center rounded-full bg-white/10 hover:bg-white/20"><Icon n="x" /></button>
            </div>
            <div className="flex items-center gap-4 rounded-2xl bg-white/[.05] p-3.5">
              <Ring value={openWeek.score} max={100} size={84} sw={9} color={openWeek.score >= 85 ? '#22C55E' : openWeek.score >= 65 ? '#22D3EE' : '#FF7A45'} track="rgba(255,255,255,.12)">
                <span className="font-display text-[20px] font-extrabold tnum">{openWeek.score}%</span>
              </Ring>
              <div className="min-w-0 text-[13px] leading-snug text-[#C7D7F0]">
                <div className="font-display text-[16px] font-bold text-white">{openWeek.score >= 85 ? '¡Gran semana!' : openWeek.score >= 65 ? 'Buena semana' : 'Semana para retomar'}</div>
                Cumplimiento del plan: entrenamientos y comidas.
              </div>
            </div>

            <h3 className="mt-4 mb-2 flex items-center gap-2 text-[14px] font-bold"><Icon n="dumbbell" s={16} className="text-[#67E8F9]" />Entrenamientos · {openWeek.trained} de {openWeek.sessions.length}</h3>
            <ul className="flex flex-col gap-1.5">
              {openWeek.sessions.map((s) => (
                <li key={s.day} className="flex items-center justify-between gap-3 rounded-xl bg-white/[.04] px-3 py-2.5">
                  <span className="min-w-0"><span className="block text-[12px] font-bold text-[#67E8F9]">{DAY_NAMES[s.day]}</span><span className="block text-[13.5px] font-semibold">{s.name}</span></span>
                  {s.done ? <Chip tone="green"><Icon n="check" s={12} w={3} />Cumplido</Chip> : <Chip tone="orange"><Icon n="x" s={12} w={3} />No realizado</Chip>}
                </li>
              ))}
            </ul>

            <h3 className="mt-4 mb-2 flex items-center gap-2 text-[14px] font-bold"><Icon n="food" s={16} className="text-[#67E8F9]" />Alimentación</h3>
            <div className="grid grid-cols-3 gap-2 text-center">
              {[['Comidas del plan', `${openWeek.meals}%`], ['Días en tu meta', `${openWeek.inTarget} de 7`], ['Promedio diario', `${fmt(openWeek.avgKcal)} kcal`]].map(([l, v]) => (
                <div key={l} className="rounded-2xl bg-white/[.05] px-2 py-3"><div className="font-display text-[16px] font-bold tnum">{v}</div><div className="text-[11.5px] text-[#9FB0C8]">{l}</div></div>
              ))}
            </div>
            <div className="mt-2 text-[12.5px] text-[#9FB0C8] tnum">Tu meta era {fmt(base.kcal)} kcal al día.</div>

            <h3 className="mt-4 mb-2 flex items-center gap-2 text-[14px] font-bold"><Icon n="scale" s={16} className="text-[#67E8F9]" />Peso</h3>
            <div className="rounded-2xl bg-white/[.05] p-3 text-[14px] font-semibold tnum">{openWeek.weight > 0 ? '+' : ''}{openWeek.weight.toFixed(1)} kg en la semana</div>

            <div className="mt-4 rounded-2xl p-3.5 text-[13px] leading-snug" style={{ background: HERO_BG }}>
              <div className="mb-1 flex items-center gap-2 text-[12px] font-bold tracking-[1.2px] text-[#CFF4FF]"><Icon n="sparkle" s={14} />ICOACH</div>
              {openWeek.trained < openWeek.sessions.length
                ? `Te ${openWeek.sessions.length - openWeek.trained === 1 ? 'faltó 1 entrenamiento' : `faltaron ${openWeek.sessions.length - openWeek.trained} entrenamientos`}. La semana siguiente mantuve la misma carga para que la completes sin forzarte.`
                : '¡Cumpliste todos tus entrenamientos! La semana siguiente subí un poco la carga.'}
              {openWeek.inTarget < 5 ? ' En la alimentación, intenta acercarte a tu meta de calorías más días.' : ''}
            </div>
          </div>
        </div>
      )}

      {notifOpen && (
        <div className="fade-in absolute inset-0 z-40 flex flex-col bg-[#060A14]/75">
          <div role="dialog" aria-modal="true" aria-labelledby="nt-title" className="pop m-3 rounded-[26px] border border-white/10 bg-[#0D1628] p-4 text-white shadow-2xl">
            <div className="mb-2 flex items-center justify-between gap-2">
              <h2 id="nt-title" className="font-display text-[19px] font-bold">Notificaciones</h2>
              <div className="flex items-center gap-1">
                {unread > 0 && <button type="button" onClick={() => setReadIds(notifs.map((n) => n.id))} className="h-10 rounded-xl px-2.5 text-[12.5px] font-semibold text-[#67E8F9] hover:bg-white/10">Marcar todo como leído</button>}
                <button type="button" aria-label="Cerrar" onClick={() => setNotifOpen(false)} className="flex h-10 w-10 items-center justify-center rounded-full bg-white/10 hover:bg-white/20"><Icon n="x" /></button>
              </div>
            </div>
            <ul className="flex flex-col gap-1.5">
              {notifs.map((n) => {
                const isNew = !readIds.includes(n.id);
                return (
                  <li key={n.id}>
                    <button type="button" onClick={() => openNotif(n)} className={`flex w-full items-start gap-3 rounded-2xl p-3 text-left transition hover:bg-white/10 ${isNew ? 'bg-white/[.07]' : ''}`}>
                      <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-full" style={{ background: isNew ? BTN_BG : 'rgba(255,255,255,.08)' }}><Icon n={n.icon} s={18} /></span>
                      <span className="min-w-0 flex-1">
                        <span className="flex items-center justify-between gap-2"><span className={`text-[14px] ${isNew ? 'font-bold' : 'font-semibold text-[#C7D7F0]'}`}>{n.title}</span><span className="shrink-0 text-[11px] text-[#9FB0C8]">{n.time}</span></span>
                        <span className="block text-[12.5px] leading-snug text-[#9FB0C8]">{n.body}</span>
                      </span>
                      {isNew && <span className="mt-1.5 h-2 w-2 shrink-0 rounded-full bg-energy" aria-label="Sin leer" />}
                    </button>
                  </li>
                );
              })}
            </ul>
          </div>
          <button type="button" aria-label="Cerrar notificaciones" className="flex-1" onClick={() => setNotifOpen(false)} />
        </div>
      )}
    </div>
  );
}

/* ---------- App + review stage ---------- */
const initialState = (e) => ({ sets: {}, meals: { '0-Desayuno': true, '0-Almuerzo': true }, extra: [], weights: makeWeights(e.weight), day: 0, custom: [], favs: ['Café con azúcar', 'Guineo'] });

function App() {
  const [screen, setScreen] = useState('login');
  const [hw, setHw] = useState('faceid');
  const [linked, setLinked] = useState(false);
  const [sheet, setSheet] = useState(null);
  const [autoNext, setAutoNext] = useState(false);
  const [lang, setLang] = useState('es');
  const [evaluated, setEvaluated] = useState(false);
  const [editing, setEditing] = useState(false);
  const [ev, setEv] = useState(EVAL_SAMPLE);
  const [st, setSt] = useState(() => initialState(EVAL_SAMPLE));
  const timers = useRef([]);
  const name = 'Ana';
  const plan = computePlan(ev);
  const weekDone = plan.pattern.filter((i) => i < TODAY).length;

  const clear = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  const later = (fn, ms) => timers.current.push(setTimeout(fn, ms));
  const go = (s, auto = false) => { clear(); setSheet(null); setAutoNext(auto); setScreen(s); };
  const afterAuth = () => (evaluated ? go('welcome', true) : (setEditing(false), go('evaluation')));
  const scan = (linking) => {
    clear();
    setSheet({ step: 'scan', linking });
    later(() => { setSheet({ step: 'ok', linking }); if (linking) setLinked(true); }, 1700);
    later(afterAuth, 2900);
  };
  const onLogin = () => (hw !== 'none' && !linked ? setSheet({ step: 'link' }) : afterAuth());
  const finishEval = (e) => { setEv(e); setSt((s) => ({ ...s, weights: makeWeights(e.weight) })); setEvaluated(true); go('coach'); };
  const jump = (s) => { if (s === 'welcome' || s === 'dashboard') setEvaluated(true); if (s === 'evaluation') setEditing(evaluated); go(s); };
  const reset = () => { go('login'); setLinked(false); setEvaluated(false); setEv(EVAL_SAMPLE); setSt(initialState(EVAL_SAMPLE)); };

  const tabs = [['login', '1', 'Inicio de sesión', 'Biometría y muñeco'], ['evaluation', '2', 'Evaluación física', 'Resultados del médico → iCoach'], ['welcome', '3', 'Tu meta te espera', 'Bienvenida'], ['dashboard', '4', 'Panel', 'Inicio, entrenamientos, nutrición, progreso, perfil']];
  const active = screen === 'coach' ? 'evaluation' : screen;

  return (
    <div className="mx-auto flex max-w-[1080px] flex-wrap items-start justify-center gap-x-12 gap-y-8">
      <aside className="flex w-full max-w-[400px] flex-col gap-5 lg:sticky lg:top-6 lg:max-w-[340px]">
        <div>
          <div className="text-[12px] font-semibold tracking-[2px] text-[#38B6F5]">PROTOTIPO INTERACTIVO</div>
          <h1 className="mt-1 font-display text-[30px] font-extrabold leading-tight text-[#E6EDF7]">AppFitness<span className="text-energy">RD</span></h1>
          <p className="mt-2 text-[14px] leading-relaxed text-[#94A3B8]">Inicia sesión, registra los resultados de tu evaluación física y deja que el iCoach arme tu plan. También puedes saltar directo a cada pantalla.</p>
        </div>
        <nav aria-label="Pantallas" className="flex flex-col gap-2">
          {tabs.map(([k, num, label, sub]) => (
            <button key={k} type="button" aria-current={active === k ? 'step' : undefined} onClick={() => jump(k)}
              className={`flex items-center gap-3 rounded-2xl border p-3 text-left transition ${active === k ? 'border-[#38B6F5] bg-[#0F2340]' : 'border-[#1E2C44] bg-[#0E1726] hover:bg-[#122038]'}`}>
              <span className={`flex h-9 w-9 shrink-0 items-center justify-center rounded-xl font-display text-[15px] font-bold ${active === k ? 'bg-[#38B6F5] text-[#04121A]' : 'bg-[#13213A] text-[#94A3B8]'}`}>{num}</span>
              <span className="min-w-0"><span className="block text-[14.5px] font-semibold text-[#E6EDF7]">{label}</span><span className="block text-[12.5px] text-[#94A3B8]">{sub}</span></span>
            </button>
          ))}
        </nav>
        <div className="flex flex-col gap-2 rounded-2xl border border-[#1E2C44] bg-[#0E1726] p-3.5">
          <span id="hw-label" className="text-[12.5px] font-semibold text-[#94A3B8]">Hardware del teléfono</span>
          <div role="group" aria-labelledby="hw-label" className="grid grid-cols-3 gap-1.5">
            {[['faceid', 'Face ID'], ['touchid', 'Huella'], ['none', 'Ninguno']].map(([k, l]) => (
              <button key={k} type="button" aria-pressed={hw === k} onClick={() => { setHw(k); setSheet(null); clear(); if (k === 'none') setLinked(false); }}
                className={`h-11 rounded-xl text-[13px] font-semibold transition ${hw === k ? 'bg-[#38B6F5] text-[#04121A]' : 'bg-[#13213A] text-[#CBD5E1] hover:bg-[#1A2B48]'}`}>{l}</button>
            ))}
          </div>
          <div className="mt-1 flex items-center justify-between gap-2 text-[12.5px]">
            <span className="text-[#94A3B8]">Biometría: <b className={linked ? 'text-[#4ADE80]' : 'text-[#CBD5E1]'}>{linked ? 'vinculada' : 'no vinculada'}</b> · Evaluación: <b className={evaluated ? 'text-[#4ADE80]' : 'text-[#CBD5E1]'}>{evaluated ? 'sí' : 'no'}</b></span>
            <button type="button" onClick={reset} className="flex h-9 items-center gap-1.5 rounded-lg px-2 font-semibold text-[#38B6F5] hover:bg-[#13213A]"><Icon n="refresh" s={15} />Reiniciar</button>
          </div>
        </div>
        <p className="text-[12px] leading-relaxed text-[#7C8BA1]">Los datos son de ejemplo (Ana, 72 kg, lesión de rodilla, alergia a mariscos). Cambia la evaluación y verás cómo el iCoach ajusta calorías, comidas y ejercicios. El muñeco y el logo son los de tu diseño original.</p>
      </aside>

      <div className="relative w-full max-w-[410px]">
        <div className="relative h-[864px] w-full rounded-[54px] bg-[#05080F] p-[10px] shadow-[0_40px_90px_-30px_rgba(56,182,245,.35),0_0_0_1px_#1E2C44]">
          <div className="relative h-full w-full overflow-hidden rounded-[44px] bg-[#060A14] text-ink">
            {screen === 'login' && <Login key="login" hw={hw} linked={linked} lang={lang} setLang={setLang} onLogin={onLogin} onBio={() => scan(false)} />}
            {screen === 'evaluation' && <Evaluation key={'ev' + editing} initial={ev} editing={editing} onDone={finishEval} onExit={() => go(evaluated ? 'dashboard' : 'login')} />}
            {screen === 'coach' && <CoachBuild key="coach" e={ev} onDone={() => go('welcome', true)} />}
            {screen === 'welcome' && <Welcome key="welcome" name={name} done={weekDone} goal={ev.days} autoNext={autoNext} onContinue={() => go('dashboard')} />}
            {screen === 'dashboard' && <Dashboard key="dash" name={name} e={ev} plan={plan} hw={hw} linked={linked} setLinked={setLinked} st={st} setSt={setSt} onLogout={() => go('login')} onEditEval={() => { setEditing(true); go('evaluation'); }} />}
            <BioSheet sheet={sheet} hw={hw} onActivate={() => scan(true)} onSkip={afterAuth} />
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
